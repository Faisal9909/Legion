<html lang="en">
<head>

  /* #wrap only measures the safe area (notch, Dynamic Island, home bar); the canvas covers the
     whole screen and the playfield is placed inside the safe area, with grass drawn out to the edges */

    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

<div id="wrap"></div><canvas id="c"></canvas>
<script>
'use strict';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});

// =====================================================================
//  LEGION RAID
//  Pick an army from your camp, then tap around an enemy base to send
//  your troops in. Smash the Town Hall and the defenses for 3 stars.
// =====================================================================

// ---------- constants & utils ----------------------------------------
const W = 450, H = 975;
const F = "'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif";
const OUT = '#2a1d18';
const LW = 2.3;
const STEP = 1 / 60;
// the base grid
const TS = 18, COLS = 24, ROWS = 36, NT = COLS * ROWS;
const MX = 9, MY = 114, MW = COLS * TS, MH = ROWS * TS;   // map on the board: 432 x 648
const RAID_T = 150;            // 2:30
const TSCALE = 0.6;            // troop figure size on the map

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }
function ell(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function tri(g, x1, y1, x2, y2, x3, y3) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); g.closePath(); }
function fs(g, fill, stroke, lw) {
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || LW; g.stroke(); }
}
function line(g, x1, y1, x2, y2, color, lw) {
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = color; g.lineWidth = lw; g.stroke();
}
// a stroke with a dark outline under it (for spears, bows, trunks)
function oline(g, pts, color, lw) {
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  if (pts.length === 4) g.lineTo(pts[2], pts[3]); else g.quadraticCurveTo(pts[2], pts[3], pts[4], pts[5]);
  g.strokeStyle = OUT; g.lineWidth = lw + 2.2; g.stroke();
  g.strokeStyle = color; g.lineWidth = lw; g.stroke();
}
function txt(g, s, x, y, size, fill, o = {}) {
  g.font = `400 ${size}px ${F}`;
  g.textAlign = o.align || 'center'; g.textBaseline = 'middle';
  if (o.stroke !== false) {
    g.lineJoin = 'round'; g.lineWidth = o.lw || Math.max(3, size * 0.18);
    g.strokeStyle = o.stroke || OUT; g.strokeText(s, x, y);
  }
  g.fillStyle = fill; g.fillText(s, x, y);
}
function fitSize(g, s, maxW, size, min) {
  while (size > min) { g.font = `400 ${size}px ${F}`; if (g.measureText(s).width <= maxW) break; size--; }
  return size;
}

// ---------- data ------------------------------------------------------
// figure art data shared with Legion Clash (h = head-top height, size = drawing scale)
const UNITS = {
  swordsman: { single: 'Swordsman', plural: 'Swordsmen', size: 1.15, h: 42 },
  spearman: { single: 'Spearman', plural: 'Spearmen', size: 1.15, h: 36 },
  archer: { single: 'Archer', plural: 'Archers', size: 1.08, h: 38 },
  wolf: { single: 'Wolf', plural: 'Wolves', size: 1.05, h: 30 },
  rider: { single: 'Rider', plural: 'Riders', size: 1.08, h: 50 },
  healer: { single: 'Healer', plural: 'Healers', size: 1.08, h: 38 },
  catapult: { single: 'Catapult', plural: 'Catapults', size: 1.1, h: 36 },
  elephant: { single: 'War Elephant', plural: 'Elephants', size: 1.1, h: 72 },
};
// raid stats. house = camp space. pref: any = nearest building, def = defenses first
const TROOPS = {
  swordsman: { house: 1, hp: 125, dmg: 15, cd: 1.0, speed: 34, reach: 4, pref: 'any', role: 'Hits the nearest building', unlock: 0 },
  archer:    { house: 1, hp: 50, dmg: 12, cd: 1.0, speed: 33, range: 64, pref: 'any', role: 'Shoots over walls from range', unlock: 0 },
  spearman:  { house: 2, hp: 230, dmg: 22, cd: 1.1, speed: 30, reach: 12, pref: 'any', role: 'Tough, long reach. 2x vs walls', wallX: 2, unlock: 0 },
  wolf:      { house: 2, hp: 115, dmg: 17, cd: 0.6, speed: 64, reach: 3, pref: 'def', role: 'Fast. Goes for defenses', unlock: 150 },
  rider:     { house: 5, hp: 440, dmg: 34, cd: 1.1, speed: 56, reach: 5, pref: 'def', role: 'Hunts defenses. First hit 3x', charge: true, unlock: 400 },
  catapult:  { house: 6, hp: 230, dmg: 62, cd: 3.0, speed: 16, range: 122, aoe: 27, pref: 'any', role: 'Long range splash. 4x vs walls', wallX: 4, unlock: 600 },
  healer:    { house: 10, hp: 280, heal: 34, cd: 1.2, speed: 36, range: 46, pref: 'heal', air: true, role: 'Flies. Heals nearby troops', unlock: 900 },
  elephant:  { house: 12, hp: 1900, dmg: 58, cd: 1.5, speed: 24, reach: 8, pref: 'def', role: 'Giant tank. Goes for defenses', unlock: 1500 },
};
const ORDER = ['swordsman', 'archer', 'spearman', 'wolf', 'rider', 'catapult', 'healer', 'elephant'];
const WIDE = { wolf: 1.35, rider: 1.7, catapult: 1.9, elephant: 2.7 };
// buildings. n = footprint size in tiles
const BLD = {
  th:     { n: 4, hp: 1900, name: 'Town Hall' },
  cannon: { n: 3, hp: 540, name: 'Cannon', def: true, dmg: 24, cd: 0.9, range: 118, ground: true },
  tower:  { n: 3, hp: 480, name: 'Archer Tower', def: true, dmg: 13, cd: 0.65, range: 130, air: true, ground: true },
  mortar: { n: 3, hp: 500, name: 'Mortar', def: true, dmg: 42, cd: 4.6, range: 190, min: 64, aoe: 30, ground: true },
  gold:   { n: 3, hp: 720, name: 'Gold Storage' },
  hut:    { n: 2, hp: 270, name: 'Hut' },
  wall:   { n: 1, hp: 380, name: 'Wall' },
};
const CHIEFS = ['Grog', 'Ulf Ironbeard', 'Big Brenna', 'Harald', 'Olga Storm', 'Borg the Huge', 'The Wolf King', 'Sven Redaxe', 'Hilda', 'Ragnar'];
const FORTS = ['Camp', 'Fort', 'Hold', 'Keep', 'Stronghold'];
const baseName = L => CHIEFS[(L - 1) % CHIEFS.length] + "'s " + FORTS[Math.min(FORTS.length - 1, Math.floor((L - 1) / 3))];

const PAL = [
  { main: '#e0453b', dark: '#8e1f1a', light: '#ff9b8f', tunic: '#e0453b', skin: '#f6c99a', metal: '#c9d2dc', gold: '#f6c343', wood: '#9a6434', ring: 'rgba(224,69,59,.75)', hair: '#5b3620' },
  { main: '#3b7dd8', dark: '#1d4382', light: '#9cc6ff', tunic: '#8a5a32', skin: '#f7d7b8', metal: '#a9b1bb', gold: '#f6c343', wood: '#86582d', ring: 'rgba(59,125,216,.75)', hair: '#e0823a' },
];

// ---------- canvas setup ---------------------------------------------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1, bgCanvas = null, layerC = null, zoneC = null;
// OX/OY: where the 450x975 board starts on screen (CSS px). VX0..VH: the whole screen in board units.
let OX = 0, OY = 0, VX0 = 0, VY0 = 0, VW = W, VH = H;
const SPR = new Map();   // figure sprite cache, cleared on resize
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const wrap = document.getElementById('wrap'), cs = getComputedStyle(wrap);
  const sw = wrap.clientWidth, sh = wrap.clientHeight;
  const pl = parseFloat(cs.paddingLeft) || 0, pr = parseFloat(cs.paddingRight) || 0;
  const pt = parseFloat(cs.paddingTop) || 0, pb = parseFloat(cs.paddingBottom) || 0;
  const aw = sw - pl - pr, ah = sh - pt - pb;
  scale = Math.min(aw / W, ah / H);
  OX = pl + (aw - W * scale) / 2; OY = pt + (ah - H * scale) / 2;
  VX0 = -OX / scale; VY0 = -OY / scale; VW = sw / scale; VH = sh / scale;
  cv.style.width = sw + 'px'; cv.style.height = sh + 'px';
  cv.width = Math.round(sw * dpr); cv.height = Math.round(sh * dpr);
  bgCanvas = null; layerC = null; zoneC = null;
  SPR.clear();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { bgCanvas = null; });

// ---------- save (this device only) ------------------------------------
const SAVE_KEY = 'legionraid.save';
function freshSave() {
  return { gold: 0, unlocked: 1, stars: {}, cap: 25, capN: 0, train: 1, have: ['swordsman', 'archer', 'spearman'], army: { swordsman: 15, archer: 10 }, speed: 1, view: 1, raids: 0 };
}
function loadSave() {
  const d = freshSave();
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s === 'object') for (const k in d) if (s[k] != null) d[k] = s[k];
  } catch (e) {}
  return d;
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(P)); } catch (e) {} }
const P = loadSave();

// ---------- state -----------------------------------------------------
const G = {
  state: 'home', t: 0, btns: [], parts: [], floats: [], timers: [], fx: [], shake: 0, banner: null,
  L: 1, S: [], occ: new Int16Array(NT), allow: new Uint8Array(NT), sver: 0, total: 0, destroyed: 0,
  troops: [], proj: [], left: {}, sel: null, raidT: RAID_T, ended: false, deployed: false, res: null,
  press: null, warnT: 0, hintT: 0, loot: 0, speed: P.speed || 1, rt: 0,
  confirm: false,   // the "End raid now?" dialog is open (battle paused)
};
function later(t, fn) { G.timers.push({ t, fn }); }
const housing = a => ORDER.reduce((s, t) => s + (a[t] || 0) * TROOPS[t].house, 0);
const trainMult = () => 1 + 0.15 * (P.train - 1);
const lvlMult = L => 1 + 0.11 * (L - 1);
const lootOf = L => 120 + 80 * L;

// =====================================================================
//  BASE GENERATION (same seed -> same base every time)
// =====================================================================
const CORE3 = [[7, 13], [14, 13], [7, 20], [14, 20]];
const CORE2 = [[11, 13], [11, 21], [7, 17], [15, 17]];
const OUT3 = [[3, 8], [8, 8], [13, 8], [18, 8], [3, 25], [8, 25], [13, 25], [18, 25], [3, 17], [18, 17]];
const OUT2 = [[3, 14], [19, 14], [3, 21], [19, 21]];
function loopTiles(c0, r0, c1, r1, gaps) {
  const t = [];
  for (let c = c0; c <= c1; c++) { t.push([c, r0]); t.push([c, r1]); }
  for (let r = r0 + 1; r < r1; r++) { t.push([c0, r]); t.push([c1, r]); }
  if (!gaps) return t;
  const mc = (c0 + c1) / 2, mr = (r0 + r1) / 2;
  return t.filter(([c, r]) => !((r === r0 || r === r1) && Math.abs(c - mc) < 1.1) && !((c === c0 || c === c1) && Math.abs(r - mr) < 1.1));
}
function genBase(L) {
  const rng = mulberry32(L * 7919 + 13);
  const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const out = [{ type: 'th', c: 10, r: 16 }];
  const nC = Math.min(4, 1 + Math.floor(L / 2)), nT = Math.min(4, 1 + Math.floor((L - 1) / 2));
  const nM = L >= 7 ? 2 : L >= 3 ? 1 : 0, nG = L >= 2 ? 2 : 1, nH = Math.min(8, 2 + Math.floor(L / 2));
  const big = [];
  for (let i = 0; i < nM; i++) big.push('mortar');
  const rest = [];
  for (let i = 0; i < nC; i++) rest.push('cannon');
  for (let i = 0; i < nT; i++) rest.push('tower');
  for (let i = 0; i < nG; i++) rest.push('gold');
  big.push(...shuf(rest));
  const slots3 = [...shuf(CORE3.slice()), ...shuf(OUT3.slice())];
  big.forEach((t, i) => { const s = slots3[i]; if (s) out.push({ type: t, c: s[0], r: s[1] }); });
  const slots2 = [...shuf(CORE2.slice()), ...shuf(OUT2.slice())];
  for (let i = 0; i < nH && i < slots2.length; i++) out.push({ type: 'hut', c: slots2[i][0], r: slots2[i][1] });
  // walls: none on base 1, then a gapped inner ring, a full inner ring, then an outer ring
  let walls = [];
  if (L === 2) walls = loopTiles(6, 12, 17, 23, true);
  if (L >= 3) walls = loopTiles(6, 12, 17, 23, false);
  if (L >= 5) walls = walls.concat(loopTiles(2, 7, 21, 28, L < 8));
  for (const [c, r] of walls) out.push({ type: 'wall', c, r });
  return out;
}
let SID = 0;
function buildBase(L) {
  G.L = L; G.S = []; SID = 0;
  const m = lvlMult(L);
  for (const b of genBase(L)) {
    const d = BLD[b.type];
    G.S.push({ id: SID++, type: b.type, c: b.c, r: b.r, n: d.n, hp: d.hp * m, maxHp: d.hp * m, dead: false, flash: 0,
      wall: b.type === 'wall', def: !!d.def, dmg: (d.dmg || 0) * m, cd: rand(0.2, 1), rt: 0, tgt: null, ang: rng01(b.c, b.r) * 6.28, recoil: 0,
      x: MX + b.c * TS, y: MY + b.r * TS, w: d.n * TS, cx: MX + (b.c + d.n / 2) * TS, cy: MY + (b.r + d.n / 2) * TS });
  }
  G.total = G.S.filter(s => !s.wall).length; G.destroyed = 0;
  structChanged();
}
function rng01(a, b) { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); }
function structChanged() {
  G.sver++;
  G.occ.fill(0);
  for (const s of G.S) if (!s.dead) for (let r = s.r; r < s.r + s.n; r++) for (let c = s.c; c < s.c + s.n; c++) G.occ[r * COLS + c] = s.id + 1;
  calcAllow();
  layerC = null; zoneC = null;
}
// where troops may be dropped: not near a building, not on a wall, not inside closed walls
function calcAllow() {
  const block = new Uint8Array(NT), A = G.allow; A.fill(0);
  for (const s of G.S) {
    if (s.dead) continue;
    const m = s.wall ? 0 : 1;
    for (let r = s.r - m; r < s.r + s.n + m; r++) for (let c = s.c - m; c < s.c + s.n + m; c++) if (r >= 0 && c >= 0 && r < ROWS && c < COLS) block[r * COLS + c] = 1;
  }
  const q = [];
  for (let c = 0; c < COLS; c++) for (const r of [0, ROWS - 1]) { const i = r * COLS + c; if (!block[i] && !A[i]) { A[i] = 1; q.push(i); } }
  for (let r = 0; r < ROWS; r++) for (const c of [0, COLS - 1]) { const i = r * COLS + c; if (!block[i] && !A[i]) { A[i] = 1; q.push(i); } }
  while (q.length) {
    const i = q.pop(), c = i % COLS, r = (i / COLS) | 0;
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr; if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      const j = nr * COLS + nc; if (!block[j] && !A[j]) { A[j] = 1; q.push(j); }
    }
  }
}
const sAt = i => { const v = G.occ[i]; return v ? G.S[v - 1] : null; };
const tileOf = (x, y) => { const c = Math.floor((x - MX) / TS), r = Math.floor((y - MY) / TS); return (c < 0 || r < 0 || c >= COLS || r >= ROWS) ? -1 : r * COLS + c; };
function rectDist(x, y, s) {
  const dx = Math.max(s.x - x, 0, x - (s.x + s.w)), dy = Math.max(s.y - y, 0, y - (s.y + s.w));
  return Math.hypot(dx, dy);
}
const pct = () => G.destroyed >= G.total ? 100 : Math.floor(G.destroyed * 100 / G.total);

// ---------- path finding: one distance field per target building, walls cost extra ----------
const FLOW = new Map();
const HEAP = [];
function flow(b) {
  let f = FLOW.get(b.id);
  if (f && f.ver === G.sver) return f.d;
  const d = new Float32Array(NT).fill(1e9);
  const cost = i => { const s = sAt(i); return !s || s === b ? 1 : s.wall ? 7 + s.hp / 120 : 22; };
  HEAP.length = 0;
  const push = (i, v) => { HEAP.push([v, i]); let k = HEAP.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (HEAP[p][0] <= HEAP[k][0]) break; [HEAP[p], HEAP[k]] = [HEAP[k], HEAP[p]]; k = p; } };
  const pop = () => { const top = HEAP[0], last = HEAP.pop(); if (HEAP.length) { HEAP[0] = last; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < HEAP.length && HEAP[l][0] < HEAP[m][0]) m = l; if (r < HEAP.length && HEAP[r][0] < HEAP[m][0]) m = r; if (m === k) break; [HEAP[m], HEAP[k]] = [HEAP[k], HEAP[m]]; k = m; } } return top; };
  for (let r = b.r; r < b.r + b.n; r++) for (let c = b.c; c < b.c + b.n; c++) { d[r * COLS + c] = 0; push(r * COLS + c, 0); }
  while (HEAP.length) {
    const [v, i] = pop(); if (v > d[i]) continue;
    const c = i % COLS, r = (i / COLS) | 0;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nc = c + dc, nr = r + dr; if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      const j = nr * COLS + nc;
      if (dr && dc && (cost(r * COLS + nc) > 1 || cost(nr * COLS + c) > 1)) continue;   // no corner cutting
      const nv = v + cost(j) * (dr && dc ? 1.414 : 1);
      if (nv < d[j]) { d[j] = nv; push(j, nv); }
    }
  }
  FLOW.set(b.id, { ver: G.sver, d });
  return d;
}

// =====================================================================
//  RAID
// =====================================================================
function startRaid() {
  if (housing(P.army) <= 0) return;
  buildBase(P.view);
  G.troops = []; G.proj = []; G.fx = []; G.parts = []; G.floats = []; G.timers = []; G.banner = null;
  G.left = {}; for (const t of ORDER) if (P.army[t] > 0 && P.have.includes(t)) G.left[t] = P.army[t];
  G.sel = ORDER.find(t => G.left[t] > 0) || null;
  G.raidT = RAID_T; G.ended = false; G.deployed = false; G.res = null; G.loot = 0; G.press = null; G.hintT = 0; G.warnT = 0; G.confirm = false;
  G.state = 'raid'; FLOW.clear();
  showBanner('RAID!', 'Tap outside the red line to send troops', '#ffe08a', 1.6);
}
function newTroop(type, x, y) {
  const d = TROOPS[type], m = trainMult();
  return { type, x, y, hp: d.hp * m, maxHp: d.hp * m, dmg: (d.dmg || 0) * m, heal: (d.heal || 0) * m, d,
    s: UNITS[type].size * TSCALE, r: (type === 'elephant' ? 11 : type === 'rider' || type === 'catapult' ? 7 : 4.5),
    face: x < MX + MW / 2 ? 1 : -1, walk: 0, atk: 0, flash: 0, cdT: rand(0.1, 0.5), target: null, block: null, dead: false, air: !!d.air, charged: false };
}
function canDeploy(x, y) { const i = tileOf(x, y); return i >= 0 && G.allow[i] === 1; }
function nextSel() { G.sel = ORDER.find(t => G.left[t] > 0) || null; }
function deployAt(x, y, quiet) {

// all standing buildings and rubble, cached until something is destroyed

// red no-drop zone with a white edge, cached too
function buildZone() {

  circ(g, x, y - 15 * k, 9 * k); fs(g, '#4f9a45', OUT, 2);

function buildBg() {
  const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;

  for (let i = 0; i < 260; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(30,70,25,.25)' : 'rgba(150,210,110,.18)'; ell(g, XL + rnd() * (XR - XL), YT + rnd() * (YB - YT), 3 + rnd() * 6, 2 + rnd() * 3); g.fill(); }

  for (let r = 0; r < ROWS; r++) for (let cc = 0; cc < COLS; cc++) {

    g.fillRect(MX + cc * TS, MY + r * TS, TS, TS);
  }
  for (let i = 0; i < 160; i++) {
    const x = MX + rnd() * MW, y = MY + rnd() * MH;
    if (rnd() < 0.15) { circ(g, x, y, 1.8); fs(g, rnd() < 0.5 ? '#fff6c8' : '#ffb3c6'); }
    else { g.strokeStyle = 'rgba(60,110,40,.45)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x - 2, y); g.lineTo(x - 3, y - 4); g.moveTo(x, y); g.lineTo(x, y - 5); g.moveTo(x + 2, y); g.lineTo(x + 3, y - 4); g.stroke(); }
  }

  for (let x = XL; x < XR; x += 26) { for (let y = MY - 22; y > YT - 10; y -= 24) spots.push([x + rnd() * 8, y + rnd() * 6]); }

  g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 2;
  for (let y = by + 24; y < YB; y += 24) { g.beginPath(); g.moveTo(XL, y); g.lineTo(XR, y); g.stroke(); }
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(XL, by + 3, XR - XL, 3);

}

function drawWorld(g) {

function addTroop(t, k) {
  if (!P.have.includes(t)) return;
  const n = (P.army[t] || 0) + k;
  if (n < 0) return;
  if (k > 0 && housing(P.army) + TROOPS[t].house * k > P.cap) return;
  P.army[t] = n; save();
}
function fillArmy() {
  const have = ORDER.filter(t => P.have.includes(t));
  let guard = 0;
  while (guard++ < 500) {
    const fit = have.filter(t => housing(P.army) + TROOPS[t].house <= P.cap);
    if (!fit.length) break;
    // keep the mix you already have: add to the type you have least of (by space), else swordsmen
    const mine = fit.filter(t => P.army[t] > 0);
    const pool = mine.length ? mine : ['swordsman'].filter(t => fit.includes(t));
    if (!pool.length) break;
    pool.sort((a, b) => (P.army[a] || 0) * TROOPS[a].house - (P.army[b] || 0) * TROOPS[b].house);
    P.army[pool[0]] = (P.army[pool[0]] || 0) + 1;
  }
  save();
}

// =====================================================================
//  UPDATE & LOOP
// =====================================================================
function update(dt) {
  G.t += dt;
  if (G.timers.length) {
    const ts = G.timers; G.timers = [];
    const keep = [];
    for (const tm of ts) { tm.t -= dt; if (tm.t <= 0) tm.fn(); else keep.push(tm); }
    G.timers.push(...keep);
  }
  G.shake *= Math.pow(0.02, dt); if (G.shake < 0.1) G.shake = 0;
  G.warnT = Math.max(0, G.warnT - dt);
  for (const p of G.parts) {
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'spark') p.vy += 260 * dt;
    if (p.type === 'coinp') p.vy += 320 * dt;
    if (p.type === 'puff') { p.vx *= 0.94; p.vy *= 0.94; }
  }
  G.parts = G.parts.filter(p => p.t < p.life);
  if (G.parts.length > 500) G.parts.splice(0, G.parts.length - 500);
  for (const f of G.floats) { f.t += dt; f.y -= 28 * dt; }
  G.floats = G.floats.filter(f => f.t < f.life);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.life) G.banner = null; }
  if (G.state === 'raid') stepRaid(dt);
  if (G.state === 'result' && G.res) G.res.t += dt;
}
// holding a finger down keeps dropping troops (real time, not sped up)
function updatePress(dt) {
  const p = G.press; if (!p || G.state !== 'raid' || G.ended || G.confirm) return;
  p.acc += dt;
  if (p.acc >= 0.11) { p.acc = 0; deployAt(p.x, p.y, true); }
}
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; acc += dt;
  while (acc >= STEP) {
    if (!G.confirm) {
      const n = G.state === 'raid' ? G.speed : 1;
      for (let i = 0; i < n; i++) update(STEP);
      updatePress(STEP);
    }
    acc -= STEP;
  }
  syncHistory();
  render();
  requestAnimationFrame(frame);
}

// ---------- navigation ------------------------------------------------
// home is the top screen. Every other screen has one back step:
// army / camp / result -> home, raid -> army (before any drop) or the "End raid now?" dialog.
const isTop = () => G.state === 'home';
function goApps() { location.href = '../'; }
function goHome() { setView(P.view); G.state = 'home'; G.confirm = false; }
function closeConfirm() { G.confirm = false; }
function goBack() {
  if (G.confirm) { closeConfirm(); return; }
  const st = G.state;
  if (st === 'army' || st === 'shop') G.state = 'home';
  else if (st === 'result') goHome();
  else if (st === 'raid') {
    if (G.ended) return;                         // the result is about to show
    if (!G.deployed) { endRaid('Raid ended'); return; }   // nothing sent yet: leave now
    G.confirm = true; G.press = null;            // troops are out: ask first
  }
}
// browser / system back: keep one extra history entry while inside a sub-screen
let navPushed = false;
function syncHistory() {
  if (isTop()) navPushed = false;
  else if (!navPushed) { try { history.pushState({ lr: 1 }, ''); } catch (err) {} navPushed = true; }
}
window.addEventListener('popstate', () => {
  if (isTop()) { navPushed = false; history.back(); return; }
  navPushed = false;      // the browser just used up our entry
  goBack();
  syncHistory();          // still inside a sub-screen: put the entry back
});

// ---------- input -----------------------------------------------------
function toL(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - OX) / scale, y: (e.clientY - r.top - OY) / scale };
}
const inMap = p => p.x >= MX && p.x < MX + MW && p.y >= MY && p.y < MY + MH;
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toL(e);
  for (let i = G.btns.length - 1; i >= 0; i--) {
    const b = G.btns[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); syncHistory(); return; }
  }
  if (G.state === 'raid' && !G.ended && !G.confirm && inMap(p)) {
    G.press = { x: p.x, y: p.y, acc: 0, id: e.pointerId };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    deployAt(p.x, p.y, false);
  }
});
cv.addEventListener('pointermove', e => {
  if (!G.press || G.press.id !== e.pointerId) return;
  const p = toL(e);
  if (inMap(p)) { G.press.x = p.x; G.press.y = p.y; }
});
const endPress = e => { if (G.press && G.press.id === e.pointerId) G.press = null; };
cv.addEventListener('pointerup', endPress);
cv.addEventListener('pointercancel', endPress);
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'escape') { e.preventDefault(); goBack(); syncHistory(); return; }
  if (G.confirm) return;
  if (k === 's' && G.state === 'raid') { G.speed = G.speed === 1 ? 2 : 1; P.speed = G.speed; save(); }
  if (k >= '1' && k <= '8' && G.state === 'raid') { const t = ORDER.filter(t => G.left[t] != null)[+k - 1]; if (t && G.left[t] > 0) G.sel = t; }
});

// ---------- app icon (used once to render the home-screen icons) -------
function drawIcon(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), k = size / 100;
  g.scale(k, k); g.lineJoin = 'round'; g.lineCap = 'round';
  const gr = g.createLinearGradient(0, 0, 0, 100); gr.addColorStop(0, '#6fbf5a'); gr.addColorStop(1, '#2f6b2f');
  g.fillStyle = gr; g.fillRect(0, 0, 100, 100);
  g.fillStyle = 'rgba(255,255,255,.08)'; for (let i = 0; i < 6; i++) { circ(g, 10 + i * 18, 88 - (i % 2) * 6, 14); g.fill(); }
  g.save(); g.translate(46, 6); g.scale(0.92, 0.92); drawTowerBase(g, 0, 0, 54); g.restore();
  drawFigure(g, 'archer', 1, 1, 71, 21, 0.62, { face: -1, noRing: true });
  g.save(); g.translate(0, 70); g.beginPath(); g.rect(-2, -6, 104, 10); g.fillStyle = OUT; g.fill();
  for (let x = 2; x < 100; x += 16) { rr(g, x, -5, 14, 12, 2); fs(g, '#d6cfc0', OUT, 1.6); rr(g, x, 3, 14, 4, 1.5); fs(g, '#8f887b'); }
  g.restore();
  drawFigure(g, 'swordsman', 0, 2, 34, 92, 1.55, { face: 1, noRing: true });
  return c.toDataURL('image/png');
}

// exposed for automated testing
window.RAID = {
  G, P, startRaid, deployAt, endRaid, drawIcon, buildBase, setView, goBack, isTop,
  sim(sec) { const n = Math.round(sec / STEP); for (let i = 0; i < n && G.state === 'raid'; i++) update(STEP); for (let i = 0; i < 120 && G.timers.length; i++) update(STEP); return G.state; },
  allowed() { const out = []; for (let i = 0; i < NT; i++) if (G.allow[i]) out.push([MX + (i % COLS + 0.5) * TS, MY + (((i / COLS) | 0) + 0.5) * TS]); return out; },
  autoDeploy(spots) {
    const pts = this.allowed(), cx = MX + MW / 2, cy = MY + MH / 2;
    const want = (spots || [[cx, MY], [cx, MY + MH]]);
    const near = want.map(([x, y]) => pts.reduce((b, p) => (Math.hypot(p[0] - x, p[1] - y) < Math.hypot(b[0] - x, b[1] - y) ? p : b), pts[0]));
    let k = 0;
    for (const t of ORDER) { while (G.left[t] > 0) { G.sel = t; const p = near[k++ % near.length]; if (!deployAt(p[0], p[1], true)) return false; } }
    return true;
  },
};

requestAnimationFrame(frame);
</script>
</body>
