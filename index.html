<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Apps</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Apps">
<meta name="theme-color" content="#2b1d14">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #faf6ef; --card: #ffffff; --text: #241812; --muted: #7a6a5e; --line: #eadfd2; --accent: #c4372b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17110d; --card: #241a14; --text: #f5ece2; --muted: #b3a294; --line: #3a2c22; --accent: #ff7a6b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    /* stay clear of the notch, the Dynamic Island and the home bar */
    padding: calc(env(safe-area-inset-top, 0px) + 28px) calc(env(safe-area-inset-right, 0px) + 20px)
             calc(env(safe-area-inset-bottom, 0px) + 28px) calc(env(safe-area-inset-left, 0px) + 20px);
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .apps { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .app a {
    display: flex; align-items: center; gap: 14px; padding: 14px; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  }
  .app a:active { transform: scale(0.98); }
  .app img { width: 60px; height: 60px; border-radius: 14px; flex: none; }
  .app b { display: block; font-size: 18px; }
  .app span { color: var(--muted); font-size: 15px; }
  .tip { margin-top: 28px; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-size: 15px; }
  .tip strong { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>My Apps</h1>
  <p class="sub">Personal iPhone apps. All data stays on this device.</p>
  <ul class="apps" id="apps"></ul>
  <p class="tip"><strong>Install on iPhone:</strong> open an app in Safari, tap the Share button, then <strong>Add to Home Screen</strong>. It opens full screen from the icon.</p>
</main>
<script>
  // To add an app: put it in its own folder and add one line here.
  const APPS = [
    { path: 'legion-clash/', name: 'Legion Clash', desc: 'Build an army card by card, then watch or command the fight', icon: 'legion-clash/apple-touch-icon.png' },
  ];
  const list = document.getElementById('apps');
  for (const a of APPS) {
    const li = document.createElement('li'); li.className = 'app';
    li.innerHTML = `<a href="${a.path}"><img src="${a.icon}" alt=""><div><b></b><span></span></div></a>`;
    li.querySelector('b').textContent = a.name;
    li.querySelector('span').textContent = a.desc;
    list.appendChild(li);
  }
</script>
</body>
</html>
