<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>برج الأعمال</title>
<!-- full-screen when opened from the iPhone home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="برج الأعمال">
<meta name="theme-color" content="#101a36">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  /* keep the game clear of the notch, the Dynamic Island and the home bar */
  html { height: 100%; background: #c3c7d2; box-sizing: border-box; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font: 14px system-ui; }
  [hidden] { display: none !important; }
</style>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen 3D office floor on a grid; strategy HUD on top (cash, reputation, day, speed), objective chip, blue dock at bottom; build tray and sheets rise from the bottom. */
:root {
  --ink: #101a36;
  --ink-soft: rgba(16, 26, 54, .8);
  --paper: #eef2fa;
  --card: #ffffff;
  --text: #16203a;
  --muted: #5d6988;
  --line: #dbe2f0;
  --accent: #2f6bff;
  --accent-deep: #1b47c4;
  --go: #19a655;
  --go-deep: #0f7a3c;
  --off: #a6aec2;
  --off-deep: #848ca1;
  --warn: #e0393f;
  --warn-deep: #a8242a;
  --gold: #ffb820;
  --sky: #c3c7d2;
  --font: "Baloo Bhaijaan 2", "SF Arabic", "Geeza Pro", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--text); font-family: var(--font);
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
}
#app { position: relative; height: 100%; overflow: hidden; }
#gl, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gl { touch-action: none; }
#fx { pointer-events: none; }
svg.i { width: 1.15em; height: 1.15em; flex: none; display: block; }
button { font-family: var(--font); cursor: pointer; }

.overlay {
  position: absolute; inset-inline: 0; pointer-events: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
#hud { top: 0; padding-block: 10px; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: 6px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
  background: var(--ink-soft); color: #fff; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.14);
  padding: 2px 12px; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; line-height: 1;
  box-shadow: 0 2px 6px rgba(16,26,54,.25); white-space: nowrap;
}
.pill small { font-size: 12px; font-weight: 800; }
.pos { color: #6cf09a; } .neg { color: #ff8a8f; }
.pill.bad { background: var(--warn); }
.pill.bad .neg { color: #fff; }
.seg { direction: ltr; display: inline-flex; background: var(--ink-soft); border-radius: 999px; padding: 3px; gap: 2px; pointer-events: auto; border: 1.5px solid rgba(255,255,255,.14); }
.seg button { width: 38px; height: 32px; border: 0; border-radius: 999px; background: transparent; color: #c9d3ee; display: grid; place-items: center; }
.seg button.on { background: var(--accent); color: #fff; }
.seg svg.i { width: 18px; height: 18px; }
.iconbtn {
  pointer-events: auto; width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; background: var(--ink-soft); color: #fff; border: 1.5px solid rgba(255,255,255,.14);
}
.ring { width: 22px; height: 22px; }
#goal {
  all: unset; box-sizing: border-box; pointer-events: auto; cursor: pointer;
  display: flex; align-items: center; gap: 10px; max-width: 360px;
  background: var(--ink-soft); color: #fff; border-radius: 16px; padding: 7px 12px; border: 1.5px solid rgba(255,255,255,.14);
  font-family: var(--font); box-shadow: 0 2px 6px rgba(16,26,54,.25);
}
#goal[hidden] { display: none; }
#goal .gi { width: 30px; height: 30px; border-radius: 9px; background: var(--gold); color: #4a3000; display: grid; place-items: center; flex: none; }
#goal .gt { font-size: 14px; font-weight: 700; line-height: 1.3; }
#goal .gr { font-size: 13px; font-weight: 800; color: #ffe2a0; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
#goal.done { background: var(--go); animation: bump 1s ease-in-out infinite; }
#goal.done .gr { color: #fff; }
@keyframes bump { 50% { transform: scale(1.04); } }

#toast { top: 150px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#toast span {
  background: rgba(16, 26, 54, .92); color: #fff; font-weight: 700; font-size: 15px;
  padding: 8px 16px; border-radius: 16px; text-align: center; max-width: 100%; border: 1.5px solid rgba(255,255,255,.16);
  animation: tin .25s ease-out;
}
#toast span.r { background: var(--warn); }
#toast span.g { background: var(--go); }
@keyframes tin { from { transform: translateY(-8px); opacity: 0; } }

#dock { bottom: 0; padding-block: 10px 12px; display: flex; gap: 8px; justify-content: center; }
.tab {
  pointer-events: auto; position: relative; flex: 1; max-width: 100px; min-height: 60px;
  border: 0; border-radius: 16px; background: linear-gradient(#4a82ff, var(--accent)); color: #fff;
  box-shadow: 0 5px 0 var(--accent-deep), 0 8px 14px rgba(16,26,54,.3); font-weight: 700; font-size: 13px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.2;
}
.tab svg.i { width: 24px; height: 24px; }
.tab:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-deep); }
.tab .dot {
  position: absolute; top: -6px; inset-inline-end: -5px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box;
  border-radius: 99px; background: var(--warn); border: 2px solid #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center;
}
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.panel {
  position: absolute; inset-inline: 0; bottom: 0; background: var(--paper); border-radius: 24px 24px 0 0;
  box-shadow: 0 -10px 34px rgba(16, 26, 54, .3); padding-bottom: env(safe-area-inset-bottom, 0px);
  display: flex; flex-direction: column; animation: rise .22s ease-out;
}
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.phead {
  display: flex; align-items: center; gap: 10px; padding-block: 12px 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.phead h2 { margin: 0; font-size: 20px; font-weight: 800; flex: 1; min-width: 0; text-wrap: balance; }
.xbtn { width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--line); color: var(--text); display: grid; place-items: center; flex: none; }
#sheet { max-height: 70%; }
#body {
  overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 4px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
#scrim { position: absolute; inset: 0; background: rgba(16, 26, 54, .2); }

#buildbar { max-height: 72%; }
#bList { overflow-y: auto; }
.bscroll { display: flex; gap: 10px; overflow-x: auto; padding: 4px max(16px, env(safe-area-inset-left, 0px)) 14px; scroll-snap-type: x proximity; }
.bcard {
  flex: none; width: 138px; scroll-snap-align: start; border: 0; text-align: start; border-radius: 18px; background: #fff; padding: 10px;
  display: flex; flex-direction: column; gap: 5px; box-shadow: 0 1px 0 var(--line), 0 4px 12px rgba(16,26,54,.08); color: var(--text); position: relative;
}
.bcard:disabled { opacity: .55; }
.bcard .ti { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 21px; color: #fff; }
.bcard b { font-size: 15px; font-weight: 800; }
.bcard .fx { font-size: 12px; color: var(--muted); line-height: 1.35; min-height: 32px; }
.bcard .pr { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 4px; }
.bcard .up { font-size: 11.5px; color: var(--muted); }
.bcard .lock { position: absolute; top: 8px; inset-inline-end: 8px; background: var(--ink); color: #ffd23f; font-size: 11px; font-weight: 800; border-radius: 99px; padding: 2px 7px; }
.sec { font-size: 13px; font-weight: 800; color: var(--muted); padding-inline: max(16px, env(safe-area-inset-left, 0px)); margin-top: 2px; }

#placebar .pinfo { padding: 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; min-height: 48px; }
.pline { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.pline.ok { color: var(--go); } .pline.no { color: var(--warn); } .pline.mid { color: var(--muted); }
.pbtns { display: flex; gap: 8px; padding: 10px max(16px, env(safe-area-inset-left, 0px)) 12px; }
.pbtns .btn { white-space: nowrap; padding-inline: 8px; font-size: 15px; }
#pOk { flex: 1.4; }

.card { background: var(--card); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 0 var(--line), 0 4px 12px rgba(16,26,54,.06); }
.card h3 { margin: 0; font-size: 16px; font-weight: 800; }
.card .top { display: flex; align-items: center; gap: 10px; }
.card .top > div { flex: 1; min-width: 0; }
.ti2 { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-size: 22px; color: #fff; flex: none; }
.sub { color: var(--muted); font-size: 13.5px; line-height: 1.45; margin: 0; }
.stat { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.stat span { color: var(--muted); }
.stat b { font-variant-numeric: tabular-nums; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; flex: 1;
  border: 0; border-radius: 15px; padding: 6px 14px; background: linear-gradient(#27c36a, var(--go)); color: #fff;
  font-weight: 800; font-size: 16px; box-shadow: 0 4px 0 var(--go-deep);
}
.btn.sm { min-height: 38px; font-size: 14px; flex: none; padding: 4px 12px; box-shadow: 0 3px 0 var(--go-deep); }
.btn:disabled { background: var(--off); box-shadow: 0 4px 0 var(--off-deep); cursor: default; }
.btn.blue { background: linear-gradient(#4a82ff, var(--accent)); box-shadow: 0 4px 0 var(--accent-deep); }
.btn.red { background: var(--warn); box-shadow: 0 4px 0 var(--warn-deep); }
.btn.ghost { background: var(--line); color: var(--text); box-shadow: 0 4px 0 #bcc6da; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.btns { display: flex; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 800; padding: 3px 9px; border-radius: 99px; background: var(--line); color: var(--text); font-variant-numeric: tabular-nums; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.chip.ok { background: #d8f5e4; color: #0f6b38; } .chip.no { background: #fde0e1; color: #a8242a; } .chip.y { background: #fff1c9; color: #6b4a00; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.prow { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.prow .bar { flex: 1; }
.erow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.erow .face { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: var(--line); flex: none; }
.erow .nm { flex: 1; min-width: 0; }
.erow .nm b { font-size: 15px; display: block; }
.erow .nm span { font-size: 12.5px; color: var(--muted); }
.stars, .erow .nm span.stars { color: #f2a900; letter-spacing: -1px; font-size: 13px; }
.bonus { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; }
.bonus.p { color: var(--go); } .bonus.n { color: var(--warn); } .bonus.i { color: var(--muted); }
.linkrow { all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
canvas.chart { width: 100%; height: 150px; display: block; }
.center { text-align: center; }
.big { font-size: 48px; text-align: center; line-height: 1.15; }
#boot { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink); color: #fff; font-size: 18px; font-weight: 700; text-align: center; padding: 24px; }
@media (prefers-reduced-motion: reduce) { .panel, #goal.done, #toast span { animation: none; } }
</style>

<div id="app" dir="rtl" lang="ar">
  <canvas id="gl" aria-label="مخطط المكتب"></canvas>
  <canvas id="fx"></canvas>

  <div id="hud" class="overlay">
    <div class="row">
      <span class="pill" id="pCash"><span data-i="cash"></span><bdi id="vCash">0</bdi><small id="vDelta"></small></span>
      <span class="pill" id="pRep"><span data-i="star"></span><bdi id="vRep">0.0</bdi></span>
      <span class="grow"></span>
      <span class="pill" id="pDay"><svg class="ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="4"/><circle id="dayRing" cx="12" cy="12" r="9" fill="none" stroke="#ffd23f" stroke-width="4" stroke-dasharray="56.5" stroke-dashoffset="56.5" transform="rotate(-90 12 12)" stroke-linecap="round"/></svg><bdi id="vDay">يوم 1</bdi></span>
    </div>
    <div class="row">
      <div class="seg" id="speed">
        <button data-s="0" aria-label="إيقاف"><span data-i="pause"></span></button>
        <button data-s="1" aria-label="سرعة عادية"><span data-i="play"></span></button>
        <button data-s="2" aria-label="سرعة مضاعفة"><span data-i="ff"></span></button>
        <button data-s="4" aria-label="سرعة قصوى"><span data-i="fff"></span></button>
      </div>
      <span class="pill" id="pClock"></span>
      <span class="grow"></span>
      <button class="iconbtn" id="btnApps" aria-label="كل الألعاب"><span data-i="apps"></span></button>
      <button class="iconbtn" id="btnSettings" aria-label="الإعدادات"><span data-i="gear"></span></button>
    </div>
    <div class="row" style="flex-wrap:wrap"><button id="goal" hidden></button><span class="pill bad" id="pWarn" hidden></span></div>
  </div>

  <div id="toast" class="overlay"></div>

  <nav id="dock" class="overlay">
    <button class="tab" data-open="build"><span data-i="hammer"></span>بناء</button>
    <button class="tab" data-open="contracts"><span data-i="doc"></span>العقود<span class="dot" id="dCon" hidden></span></button>
    <button class="tab" data-open="team"><span data-i="users"></span>الفريق<span class="dot" id="dTeam" hidden></span></button>
    <button class="tab" data-open="finance"><span data-i="chart"></span>المالية</button>
  </nav>

  <section id="buildbar" class="panel" hidden>
    <div class="phead"><h2>ماذا تبني؟</h2><button class="xbtn" id="bClose" aria-label="إغلاق"><span data-i="x"></span></button></div>
    <div id="bList"></div>
  </section>

  <section id="placebar" class="panel" hidden>
    <div class="phead"><h2 id="pTitle"></h2></div>
    <div class="pinfo" id="pInfo"></div>
    <div class="pbtns">
      <button class="btn ghost" id="pRot"><span data-i="rotate"></span>تدوير</button>
      <button class="btn red" id="pCancel"><span data-i="x"></span>إلغاء</button>
      <button class="btn" id="pOk"><span data-i="check"></span><span id="pOkT">ابنِ</span></button>
    </div>
  </section>

  <div id="scrim" hidden></div>
  <section id="sheet" class="panel" hidden>
    <div class="phead"><h2 id="sTitle"></h2><button class="xbtn" id="sClose" aria-label="إغلاق"><span data-i="x"></span></button></div>
    <div id="body"></div>
  </section>
  <div id="boot">جارٍ تجهيز المكتب…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { $('boot').textContent = 'تعذّر تحميل محرك الرسم. تأكد من الاتصال بالإنترنت ثم أعد فتح الصفحة.'; return; }

// ======================= icons =======================
const ICON = {
  cash: '<rect x="1.5" y="5.5" width="21" height="13" rx="3" fill="#2fbf68"/><rect x="4" y="8" width="16" height="8" rx="1.6" fill="none" stroke="#c8f6d8" stroke-width="1.3"/><circle cx="12" cy="12" r="2.7" fill="#eafff0"/>',

  sun: '<circle cx="12" cy="12" r="4.6" fill="#ffd23f"/><g stroke="#ffd23f" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M4.9 19.1l1.9-1.9M17.2 6.8l1.9-1.9"/></g>',

// ======================= geometry of rooms =======================
const ROT = r => -r * Math.PI / 2;

const R3 = v => Math.round(v * 1000) / 1000;
function roomFrame(room) {
  const T = TYPES[room.type], th = ROT(room.r), c = Math.cos(th), s = Math.sin(th);
  let mx = Infinity, mz = Infinity;
  for (const [u, v] of [[0, 0], [T.w, 0], [0, T.d], [T.w, T.d]]) { mx = Math.min(mx, R3(u * c + v * s)); mz = Math.min(mz, R3(-u * s + v * c)); }
  return { c, s, th, ox: room.x - mx, oz: room.z - mz };
}
function l2w(room, u, v) { const f = roomFrame(room); return [R3(u * f.c + v * f.s + f.ox), R3(-u * f.s + v * f.c + f.oz)]; }

  const cell = [Math.floor(p[0] + n[0] * .5 + (n[0] === 0 ? .001 : 0)), Math.floor(p[1] + n[1] * .5 + (n[1] === 0 ? .001 : 0))];

}
function center(room) { const [w, d] = dims(room.type, room.r); return [room.x + w / 2, room.z + d / 2]; }

function adjacent(a, b) {
  const [aw, ad] = dims(a.type, a.r), [bw, bd] = dims(b.type, b.r);
  const ax1 = a.x + aw, az1 = a.z + ad, bx1 = b.x + bw, bz1 = b.z + bd;
  const ovX = Math.min(ax1, bx1) - Math.max(a.x, b.x), ovZ = Math.min(az1, bz1) - Math.max(a.z, b.z);

const DESKS = [[1, .85], [3, .85], [1, 2.1], [3, 2.1]];
function seatOf(room, k) {

}
const plotOf = (x, z) => PLOTS.find(p => x >= p.x0 && x < p.x1 && z >= p.z0 && z < p.z1);
const cellUnlocked = (x, z) => { const p = plotOf(x, z); return !!(p && S.plots[p.id]); };

function buildOcc(excludeId, extra) {
  const occ = [];
  for (let z = 0; z < LOT_D; z++) { occ.push([]); for (let x = 0; x < LOT_W; x++) occ[z].push(cellUnlocked(x, z) ? 0 : -1); }
  const put = r => { const [w, d] = dims(r.type, r.r); for (let z = r.z; z < r.z + d; z++) for (let x = r.x; x < r.x + w; x++) if (occ[z] && occ[z][x] !== undefined) occ[z][x] = r.id; };
  for (const r of S.rooms) if (r.id !== excludeId) put(r);
  if (extra) put(extra);
  return occ;
}
function bfs(occ, from) {
  const D = occ.map(r => r.map(() => -1)), P = occ.map(r => r.map(() => null)), q = [from];
  if (occ[from[1]][from[0]] !== 0) return { D, P };
  D[from[1]][from[0]] = 0;
  while (q.length) {
    const [x, z] = q.shift();
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, nz = z + dz;
      if (nz < 0 || nz >= LOT_D || nx < 0 || nx >= LOT_W) continue;
      if (occ[nz][nx] !== 0 || D[nz][nx] >= 0) continue;
      D[nz][nx] = D[z][x] + 1; P[nz][nx] = [x, z]; q.push([nx, nz]);
    }
  }

}
function validate(cand, excludeId) {
  const [w, d] = dims(cand.type, cand.r);
  if (cand.x < 0 || cand.z < 0 || cand.x + w > LOT_W || cand.z + d > LOT_D) return 'خارج حدود المكتب';
  const base = buildOcc(excludeId);
  for (let z = cand.z; z < cand.z + d; z++) for (let x = cand.x; x < cand.x + w; x++) {
    if (base[z][x] === -1) return 'هذه المساحة مقفلة، وسّع المكتب أولاً';
    if (base[z][x] !== 0) return 'يتداخل مع قسم آخر';
  }
  const occ = buildOcc(excludeId, Object.assign({ id: -9 }, cand));
  if (occ[ENTR[1]][ENTR[0]] !== 0) return 'يسد مدخل المكتب';
  const di = doorInfo(cand), [cx, cz] = di.cell;
  if (cx < 0 || cz < 0 || cx >= LOT_W || cz >= LOT_D || occ[cz][cx] !== 0) return 'باب القسم مسدود، اترك ممراً أمامه';
  const { D } = bfs(occ, ENTR);
  if (D[cz][cx] < 0) return 'لا يوجد ممر من المدخل إلى باب القسم';
  for (const r of S.rooms) {
    if (r.id === excludeId) continue;
    const c = doorInfo(r).cell;
    if (!occ[c[1]] || occ[c[1]][c[0]] !== 0 || D[c[1]][c[0]] < 0) return `يسد الممر إلى ${TYPES[r.type].name}`;
  }

}

// ======================= analysis & economy =======================
const repLvl = () => Math.floor(S.rep + 1e-9);
const roomById = id => S.rooms.find(r => r.id === id);
const empsIn = id => S.emps.filter(e => e.room === id);
const capacity = () => 4 + FAC.parking.cap * S.fac.parking + FAC.bus.cap * S.fac.bus + FAC.metro.cap * S.fac.metro;
const shortage = () => Math.max(0, S.emps.length - capacity());
const slots = () => Math.min(5, 2 + S.rooms.filter(r => r.type === 'meet').length);
let layoutVer = 0, anVer = -1;
const AN = new Map();
function analyze(room, rooms) {
  const T = TYPES[room.type], lines = [];
  let mult = 1, breakNear = false;
  if (T.kind !== 'prod') return { mult, lines, breakNear };
  const others = rooms.filter(o => o.id !== room.id);
  const adjT = t => others.some(o => o.type === t && adjacent(room, o));
  const meets = others.filter(o => o.type === 'meet' && adjacent(room, o)).length;
  if (meets) { const v = .1 * Math.min(2, meets); mult += v; lines.push(['ملاصق لغرفة اجتماعات', v]); }
  if (room.type === 'design' && adjT('market')) { mult += .15; lines.push(['بجانب التسويق', .15]); }
  if (room.type === 'market' && adjT('design')) { mult += .15; lines.push(['بجانب التصميم', .15]); }
  if (room.type === 'dev' && (adjT('sales') || adjT('market'))) { mult -= .15; lines.push(['ضجيج من قسم ملاصق', -.15]); }
  if (room.type === 'sales') { const c = center(room); if (Math.hypot(c[0] - 1.5, c[1] - 11.5) <= 5) { mult += .2; lines.push(['قريب من المدخل', .2]); } }
  if (room.type === 'dev' && others.some(o => o.type === 'server' && dist(room, o) <= 6.5)) { mult += .3; lines.push(['خوادم قريبة', .3]); }
  if (others.some(o => o.type === 'break' && dist(room, o) <= 6.5)) { breakNear = true; lines.push(['استراحة قريبة: مزاج +15', 'mood']); }
  return { mult, lines, breakNear };
}
function A(room) {
  if (anVer !== layoutVer) { AN.clear(); for (const r of S.rooms) AN.set(r.id, analyze(r, S.rooms)); anVer = layoutVer; }
  return AN.get(room.id) || analyze(room, S.rooms);
}
function morale(e) {
  const r = roomById(e.room); if (!r) return 60;
  let m = 62;
  if (A(r).breakNear) m += 15;
  m += 8 * Math.min(2, empsIn(r.id).filter(x => x.id !== e.id && x.trait === 'cheer').length);
  if (shortage() > 0) m -= 25;
  return clamp(m, 0, 100);
}
const moodF = m => clamp(m / 80, .5, 1.25);
const face = m => m >= 80 ? '😄' : m >= 62 ? '🙂' : m >= 45 ? '😐' : '😠';
function empRate(e) { const r = roomById(e.room); return r ? PER_STAR * e.stars * TRAITS[e.trait].out * A(r).mult * moodF(morale(e)) : 0; }
function rates() { const o = { S: 0, G: 0, M: 0, D: 0 }; for (const e of S.emps) { const r = roomById(e.room); if (r) o[TYPES[r.type].pt] += empRate(e); } return o; }
const roomRate = r => empsIn(r.id).reduce((a, e) => a + empRate(e), 0);
const salaries = () => S.emps.reduce((a, e) => a + e.salary, 0);
const upkeep = () => S.rooms.reduce((a, r) => a + TYPES[r.type].upkeep, 0) + Object.keys(FAC).reduce((a, k) => a + FAC[k].upkeep * S.fac[k], 0);

const value = () => Math.max(0, S.cash + assets() * .6 + Math.max(0, avgProfit()) * 15 + S.rep * 4000);

// ======================= contracts =======================
function genOffer() {
  const lvl = repLvl(), R = rates();
  const pool = CTPL.filter(c => c.rep <= lvl);
  const have = new Set(S.rooms.filter(r => TYPES[r.type].kind === 'prod').map(r => TYPES[r.type].pt));
  const fit = pool.filter(c => Object.keys(c.req).every(t => have.has(t)));
  const tpl = fit.length && Math.random() < .75 ? pick(fit) : pick(pool);
  const days = 2 + Math.floor(Math.random() * 4);
  const types = Object.keys(tpl.req);
  const rate = types.reduce((a, t) => a + R[t], 0);
  const per = Math.max(35 + lvl * 25, rate * .85);
  const total = Math.max(30, Math.round(per * days * rnd(.55, 1.0) / 10) * 10);
  const req = {};
  types.forEach(t => { req[t] = Math.max(10, Math.round(total * tpl.req[t] / 5) * 5); });
  const sum = types.reduce((a, t) => a + req[t], 0);
  const pay = Math.round(sum * (4.3 + lvl * .55) * rnd(.9, 1.18) / 10) * 10;
  return { id: S.nid++, client: pick(CLIENTS), name: tpl.name, req, days, pay, rep: Math.round((.12 + Math.min(.38, sum / 1400)) * 100) / 100, exp: 2 };
}
// days needed to finish `req`, given that the first `ahead` active contracts are served first
function etaDays(req, ahead) {
  const R = rates(); let worst = 0;
  for (const t of Object.keys(req)) {
    let need = req[t];
    for (let i = 0; i < ahead; i++) { const c = S.contracts[i]; need += Math.max(0, (c.req[t] || 0) - (c.prog[t] || 0)); }
    if (need <= 0) continue;
    worst = Math.max(worst, R[t] > 0 ? need / R[t] : Infinity);
  }
  return worst;
}
function acceptOffer(id) {
  const o = S.offers.find(x => x.id === id);
  if (!o || S.contracts.length >= slots()) return;
  S.offers.splice(S.offers.indexOf(o), 1);
  S.contracts.push(Object.assign({}, o, { prog: {} }));
  snd('buy'); toast(`قبلت عقد «${o.name}»`); save();
}
function earn(v) { S.cash += v; S.today.inc += v; }
function completeContract(c) {
  S.contracts.splice(S.contracts.indexOf(c), 1);
  earn(c.pay); S.rep = Math.min(5, S.rep + c.rep); S.stats.done++;
  snd('win'); toast(`أنجزت «${c.name}»: +${fmt(c.pay)} وسمعة +${c.rep}`, 'g');
  const p = $('pCash').getBoundingClientRect(), a = $('app').getBoundingClientRect();
  coinBurst(W / 2, H * .45, p.left - a.left + 30, p.top - a.top + 18, 14);
  save();
}

// ======================= employees =======================
function genCand() {
  const lvl = repLvl();
  const stars = clamp(Math.round(.8 + lvl * .6 + Math.random() * 2.3), 1, 5);
  const trait = pickW([['none', .44], ['fast', .15], ['cheer', .15], ['lazy', .13], ['learn', .13]]);
  const f = Math.random() < .45;
  const salary = Math.round((10 + stars * 14 + rnd(-4, 6)) * TRAITS[trait].sal);
  return { name: pick(f ? NF : NM), f, stars, trait, salary };
}

function hire(roomId, ci) {
  const r = roomById(roomId); if (!r) return;
  const list = cands(r.type), c = list[ci];
  if (!c || empsIn(roomId).length >= 4) return;
  if (!spend(c.salary * 2)) return;
  const used = new Set(empsIn(roomId).map(e => e.desk));
  let desk = 0; while (used.has(desk)) desk++;
  const e = { id: S.nid++, name: c.name, f: c.f, stars: c.stars, trait: c.trait, salary: c.salary, room: roomId, desk, days: 0 };
  S.emps.push(e); list.splice(ci, 1);
  snd('buy'); toast(`انضم ${c.name} إلى ${TYPES[r.type].name}`);
  spawnWalker(e); save();
}

function fireEmp(id) {

const countIn = t => S.emps.filter(e => { const r = roomById(e.room); return r && r.type === t; }).length;
const GOALS = [

function claimGoal() {
  const g = GOALS[S.goal]; if (!g) return;
  if (!g.ok()) { snd('tap'); toast(g.t); return; }
  if (g.rw) earn(g.rw);
  S.goal++; snd('win');
  if (S.goal >= GOALS.length && !S.won) { S.won = true; openSheet({ kind: 'win' }); }
  else toast(g.rw ? `هدف محقق! +${fmt(g.rw)}` : 'هدف محقق!', 'g');
  save();
}

// ======================= day cycle =======================
function simulate(dt) {
  S.t += dt;
  const R = rates(), frac = dt / DAY;
  for (const t in R) {
    let pts = R[t] * frac;
    if (pts <= 0) continue;
    for (const c of S.contracts) {
      const need = (c.req[t] || 0) - (c.prog[t] || 0);
      if (need > 0) { const take = Math.min(need, pts); c.prog[t] = (c.prog[t] || 0) + take; pts -= take; if (pts <= 1e-9) break; }
    }
    if (pts > 0) earn(pts * FREELANCE);
  }
  for (const c of [...S.contracts]) if (Object.keys(c.req).every(t => (c.prog[t] || 0) >= c.req[t] - 1e-6)) completeContract(c);
  if (S.t >= DAY) endDay();
}
function endDay() {
  const exp = salaries() + upkeep();
  S.cash -= exp; S.today.exp += exp;
  const inc = Math.round(S.today.inc), out = Math.round(S.today.exp), profit = inc - out;
  S.lastProfit = profit;
  S.hist.push({ d: S.day, inc, exp: out }); if (S.hist.length > 14) S.hist.shift();
  for (const c of [...S.contracts]) {
    c.days--;
    if (c.days <= 0) { S.contracts.splice(S.contracts.indexOf(c), 1); S.rep = Math.max(0, S.rep - .3); S.stats.failed++; toast(`فشل عقد «${c.name}»: السمعة −0.3`, 'r'); snd('no'); }
  }
  for (const o of [...S.offers]) { o.exp--; if (o.exp <= 0) S.offers.splice(S.offers.indexOf(o), 1); }
  while (S.offers.length < 3) S.offers.push(genOffer());
  for (const e of S.emps) { e.days++; if (e.trait === 'learn' && e.stars < 5 && e.days % 3 === 0) { e.stars++; toast(`${e.name} تطور إلى ${e.stars} نجوم`, 'g'); } }
  S.cands = {};
  toast(`نهاية اليوم ${S.day}: دخل ${fmt(inc)} − مصاريف ${fmt(out)} = ${profit >= 0 ? '+' : ''}${fmt(profit)}`, profit >= 0 ? '' : 'r');
  if (S.cash < 0) {
    S.negDays++;
    if (S.negDays >= 3) { S.over = true; S.speed = 0; openSheet({ kind: 'over' }); }
    else toast(`تحذير: رصيدك سالب (${S.negDays}/3). ثلاثة أيام متتالية = إفلاس!`, 'r');
  } else S.negDays = 0;
  S.day++; S.t = Math.max(0, S.t - DAY); S.today = { inc: 0, exp: 0 };
  save();
}

// ======================= sound =======================
let AC = null;
function snd(kind) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const tone = (f, d, delay = 0, type = 'triangle', vol = .06) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t + delay); g.gain.exponentialRampToValueAtTime(.0001, t + delay + d);
      o.connect(g); g.connect(AC.destination); o.start(t + delay); o.stop(t + delay + d + .03);
    };
    if (kind === 'buy') { tone(660, .09); tone(990, .12, .07); }
    else if (kind === 'build') { tone(196, .12, 0, 'square', .04); tone(392, .1, .1); tone(523, .16, .18); }
    else if (kind === 'win') { [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, i * .09)); }
    else if (kind === 'no') tone(150, .14, 0, 'sawtooth', .04);
    else if (kind === 'tap') tone(520, .04, 0, 'sine', .04);
    else if (kind === 'coin') tone(1318, .07, 0, 'square', .025);
  } catch (e) {}
}

// ======================= toast =======================
function toast(msg, cls = '') {
  const el = document.createElement('span'); el.textContent = msg; if (cls) el.className = cls;
  const box = $('toast'); box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 3400);
}

// ======================= UI: placement =======================
let mode = 'idle', place = null, resumeSpeed = 1, ghostDirty = true;
function startPlace(type, movingId) {
  closeSheet(); closeBuild();
  resumeSpeed = S.speed;
  S.speed = 0;
  mode = 'place';
  if (movingId) { const r = roomById(movingId); place = { type: r.type, x: r.x, z: r.z, r: r.r, moving: movingId }; }
  else {
    const c = screenCell(W / 2, H * .5);
    const [w, d] = dims(type, 0);
    place = { type, x: clamp(c[0] - Math.floor(w / 2), 0, LOT_W - w), z: clamp(c[1] - Math.floor(d / 2), 0, LOT_D - d), r: 0, moving: null };
    if (validate(place, null)) autoSpot();
  }
  const c = center(place); focusOn(c[0], c[1]);
  ghostDirty = true; $('dock').hidden = true; $('goal').hidden = true; $('placebar').hidden = false; updatePlacebar();
}
function autoSpot() {
  let best = null, bd = Infinity;
  for (let r = 0; r < 4; r++) for (let z = 0; z < LOT_D; z++) for (let x = 0; x < LOT_W; x++) {
    const c = { type: place.type, x, z, r };
    const [w, d] = dims(place.type, r);
    if (x + w > LOT_W || z + d > LOT_D) continue;
    if (validate(c, place.moving)) continue;
    const dd = Math.hypot(x - place.x, z - place.z) + r * .3;
    if (dd < bd) { bd = dd; best = c; }
  }
  if (best) Object.assign(place, best);
}
function exitPlace() {
  mode = 'idle'; place = null; ghostDirty = true;
  $('placebar').hidden = true; $('dock').hidden = false;
  S.speed = resumeSpeed; updateHud();
}
function confirmPlace() {
  if (!place) return;
  const why = validate(place, place.moving);
  if (why) { snd('no'); toast(why, 'r'); return; }
  let built = null;
  if (place.moving) {
    const r = roomById(place.moving); r.x = place.x; r.z = place.z; r.r = place.r;
    layoutVer++; snd('build'); toast('تم نقل القسم'); reseatRoom(r.id);
  } else {
    if (!spend(TYPES[place.type].cost)) return;
    built = { id: S.nid++, type: place.type, x: place.x, z: place.z, r: place.r };
    S.rooms.push(built); layoutVer++; snd('build');
    toast(`تم بناء ${TYPES[built.type].name}`, 'g');
    roomPop.set(built.id, T);
  }
  save(); exitPlace();
  if (built && TYPES[built.type].kind === 'prod') setTimeout(() => openSheet({ kind: 'hire', id: built.id }), 350);
}
function updatePlacebar() {
  if (!place) return;
  const T0 = TYPES[place.type];
  $('pTitle').textContent = (place.moving ? 'نقل: ' : '') + T0.ico + ' ' + T0.name;
  const why = validate(place, place.moving);
  let h = '';
  if (why) h += `<div class="pline no">${ico('alert')}${why}</div>`;
  else {
    const others = S.rooms.filter(r => r.id !== place.moving);
    const cand = Object.assign({ id: -9 }, place);
    const all = others.concat([cand]);
    const lines = analyze(cand, all).lines.map(([t, v]) => [typeof v === 'number' ? `${t} ${v > 0 ? '+' : ''}${Math.round(v * 100)}٪` : t, v]);
    for (const o of others) {
      if (TYPES[o.type].kind !== 'prod') continue;
      const a = analyze(o, others), b = analyze(o, all);
      const dm = Math.round((b.mult - a.mult) * 100);
      if (dm) lines.push([`${TYPES[o.type].name} المجاور: ${dm > 0 ? '+' : ''}${dm}٪`, dm / 100]);
      if (b.breakNear && !a.breakNear) lines.push([`${TYPES[o.type].name}: مزاج +15`, 'mood']);
    }
    if (!lines.length) h += `<div class="pline mid">${ico('check')}مكان صالح. ${T0.kind === 'prod' ? 'لا توجد مكافآت مكان هنا.' : 'لا يستفيد منه أي قسم هنا.'}</div>`;
    lines.slice(0, 4).forEach(([t, v]) => { const neg = typeof v === 'number' && v < 0; h += `<div class="pline ${neg ? 'no' : 'ok'}">${neg ? '▼' : '▲'} ${t}</div>`; });
  }
  $('pInfo').innerHTML = h;
  $('pOk').disabled = !!why || (!place.moving && S.cash < T0.cost);
  $('pOkT').textContent = place.moving ? 'انقل هنا' : `ابنِ · ${fmt(T0.cost)}`;
}
$('pRot').addEventListener('click', () => {
  if (!place) return;
  const [w0, d0] = dims(place.type, place.r);
  const cx = place.x + w0 / 2, cz = place.z + d0 / 2;
  place.r = (place.r + 1) % 4;
  const [w, d] = dims(place.type, place.r);
  place.x = clamp(Math.round(cx - w / 2), 0, LOT_W - w); place.z = clamp(Math.round(cz - d / 2), 0, LOT_D - d);
  ghostDirty = true; snd('tap'); updatePlacebar();
});

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -.1), hitV = new THREE.Vector3();
