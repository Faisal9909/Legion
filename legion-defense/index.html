<script>
'use strict';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});

// =====================================================================
//  LEGION DEFENSE
//  The blue legion marches down the road to your castle. Build towers
//  on the grass, upgrade them, and hold out until the last wave.
//  Soldier art is shared with Legion Clash.
// =====================================================================

const W = 450, H = 975;
const F = "'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif";
const OUT = '#2a1d18';
const LW = 2.3;
const STEP = 1 / 60;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }
function ell(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function tri(g, x1, y1, x2, y2, x3, y3) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); g.closePath(); }
function fs(g, fill, stroke, lw) {
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || LW; g.stroke(); }
}
function line(g, x1, y1, x2, y2, color, lw) {
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = color; g.lineWidth = lw; g.stroke();
}
// a stroke with a dark outline under it (for spears, bows, trunks)
function oline(g, pts, color, lw) {
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  if (pts.length === 4) g.lineTo(pts[2], pts[3]); else g.quadraticCurveTo(pts[2], pts[3], pts[4], pts[5]);
  g.strokeStyle = OUT; g.lineWidth = lw + 2.2; g.stroke();
  g.strokeStyle = color; g.lineWidth = lw; g.stroke();
}
function txt(g, s, x, y, size, fill, o = {}) {
  g.font = `400 ${size}px ${F}`;
  g.textAlign = o.align || 'center'; g.textBaseline = 'middle';
  if (o.stroke !== false) {
    g.lineJoin = 'round'; g.lineWidth = o.lw || Math.max(3, size * 0.18);
    g.strokeStyle = o.stroke || OUT; g.strokeText(s, x, y);
  }
  g.fillStyle = fill; g.fillText(s, x, y);
}
function fitSize(g, s, maxW, size, min) {
  while (size > min) { g.font = `400 ${size}px ${F}`; if (g.measureText(s).width <= maxW) break; size--; }
  return size;
}

const PAL = [
  { main: '#e0453b', dark: '#8e1f1a', light: '#ff9b8f', tunic: '#e0453b', skin: '#f6c99a', metal: '#c9d2dc', gold: '#f6c343', wood: '#9a6434', ring: 'rgba(224,69,59,.75)', hair: '#5b3620' },
  { main: '#3b7dd8', dark: '#1d4382', light: '#9cc6ff', tunic: '#8a5a32', skin: '#f7d7b8', metal: '#a9b1bb', gold: '#f6c343', wood: '#86582d', ring: 'rgba(59,125,216,.75)', hair: '#e0823a' },
];

// ---------- data ------------------------------------------------------
// h = head-top height of each figure (health bars, flash)
const UNITS = { swordsman: { h: 42 }, spearman: { h: 36 }, archer: { h: 38 }, wolf: { h: 30 }, rider: { h: 50 }, healer: { h: 38 }, catapult: { h: 36 }, elephant: { h: 72 } };

// grid: 10 x 16 tiles of 45, the map starts at MY; the control panel starts at PY
const TS = 45, COLS = 10, ROWS = 16, MY = 78, MB = MY + ROWS * TS, PY = 806;
const START_GOLD = 230, START_HEARTS = 20, SELL_BACK = 0.7;
const COIN_POS = { x: 124, y: 30 };

// the blue legion. cost = wave budget points, unlock = first wave on the first map
const EN = {
  spearman:  { name: 'Spearmen',   hp: 40,   speed: 36, armor: 0.1,  gold: 5,  lives: 1, dmg: 6,  cd: 1.0, s: 0.8,  cost: 1,   gap: 0.85, unlock: 1 },
  archer:    { name: 'Scouts',     hp: 28,   speed: 44, armor: 0,    gold: 4,  lives: 1, dmg: 4,  cd: 0.9, s: 0.8,  cost: 0.8, gap: 0.75, unlock: 1 },
  wolf:      { name: 'Wolves',     hp: 30,   speed: 74, armor: 0,    gold: 4,  lives: 1, dmg: 5,  cd: 0.6, s: 0.8,  cost: 1,   gap: 0.5,  unlock: 2, tag: 'FAST' },
  swordsman: { name: 'Swordsmen',  hp: 72,   speed: 30, armor: 0.55, gold: 8,  lives: 1, dmg: 9,  cd: 1.0, s: 0.82, cost: 2,   gap: 1.0,  unlock: 3, tag: 'ARMOUR' },
  healer:    { name: 'Healers',    hp: 50,   speed: 34, armor: 0,    gold: 10, lives: 1, dmg: 3,  cd: 1.2, s: 0.8,  cost: 2.5, gap: 1.4,  unlock: 4, tag: 'HEALS' },
  rider:     { name: 'Riders',     hp: 150,  speed: 56, armor: 0.5,  gold: 15, lives: 2, dmg: 14, cd: 1.0, s: 0.72, cost: 4.5, gap: 1.3,  unlock: 6, tag: 'FAST+ARMOUR' },
  catapult:  { name: 'Siege Carts', hp: 280, speed: 19, armor: 0.3,  gold: 20, lives: 3, dmg: 10, cd: 1.5, s: 0.75, cost: 6,   gap: 2.4,  unlock: 8, tag: 'TANKY' },
  elephant:  { name: 'War Elephant', hp: 650, speed: 22, armor: 0.3, gold: 80, lives: 5, dmg: 40, cd: 1.6, s: 0.72, cost: 0,  gap: 4,    unlock: 99, tag: 'BOSS', boss: true },
};
const EN_ORDER = ['elephant', 'catapult', 'rider', 'swordsman', 'healer', 'wolf', 'spearman', 'archer'];

const TW = {
  archer: { name: 'Archer Tower', short: 'Archers', desc: 'Fast arrows, one target. Weak vs armour', lv: [
    { cost: 70,  dmg: 10, range: 115, cd: 0.65 },
    { cost: 65,  dmg: 17, range: 125, cd: 0.55 },
    { cost: 110, dmg: 25, range: 140, cd: 0.45, pierce: 0.3 }] },
  catapult: { name: 'Catapult', short: 'Catapult', desc: 'Slow stones that splash a crowd', lv: [
    { cost: 120, dmg: 30, range: 135, cd: 2.6, aoe: 38 },
    { cost: 90,  dmg: 52, range: 145, cd: 2.4, aoe: 44 },
    { cost: 150, dmg: 88, range: 160, cd: 2.2, aoe: 52, fire: true }] },
  barracks: { name: 'Barracks', short: 'Barracks', desc: 'Soldiers stop enemies on the road', lv: [
    { cost: 90,  n: 2, hp: 70,  dmg: 7,  cd: 1.0,  range: 100, armor: 0 },
    { cost: 70,  n: 3, hp: 110, dmg: 11, cd: 0.95, range: 105, armor: 0.15 },
    { cost: 120, n: 3, hp: 170, dmg: 18, cd: 0.9,  range: 110, armor: 0.3 }] },
  mage: { name: 'Frost Mage', short: 'Frost Mage', desc: 'Magic ignores armour and slows', lv: [
    { cost: 100, dmg: 12, range: 105, cd: 1.1, slow: 0.4 },
    { cost: 80,  dmg: 22, range: 115, cd: 1.0, slow: 0.5 },
    { cost: 140, dmg: 36, range: 125, cd: 0.9, slow: 0.55, splash: 40 }] },
};
const TW_ORDER = ['archer', 'catapult', 'barracks', 'mage'];
const spent = t => { let s = 0; for (let i = 0; i <= t.lv; i++) s += TW[t.type].lv[i].cost; return s; };

const THEME = {
  grass: { g1: '#86c45a', g2: '#7bb951', road: '#e2c088', edge: '#b98d55', deco: ['#fff6d8', '#ffd84d', '#ff9bb0'], tree: '#4f9a3c', tree2: '#3d7f2e' },
  rock:  { g1: '#c2b56e', g2: '#b5a862', road: '#e8d3a6', edge: '#a8875a', deco: ['#9a948a', '#b3ada2', '#857f75'], tree: '#7d9a46', tree2: '#5f7d34' },
  snow:  { g1: '#e9f2f5', g2: '#dce8ee', road: '#c7a77f', edge: '#8f7150', deco: ['#ffffff', '#c9dbe4', '#b4ccd8'], tree: '#3f7a5a', tree2: '#2e5f45' },
};
const MAPS = [
  { name: 'Green Valley', waves: 15, hpM: 0.9, theme: 'grass', shift: 0, castle: [7, 14],
    paths: [[[2, -2], [2, 2], [7, 2], [7, 6], [2, 6], [2, 10], [7, 10], [7, 14]]] },
  { name: 'Rocky Pass', waves: 18, hpM: 1.3, theme: 'rock', shift: 1, castle: [2, 14],
    paths: [[[8, -2], [8, 3], [3, 3], [3, 8], [6, 8], [6, 11], [2, 11], [2, 14]]] },
  { name: 'Frost Ridge', waves: 20, hpM: 1.25, theme: 'snow', shift: 2, castle: [5, 14],
    paths: [[[1, -2], [1, 5], [4, 5], [4, 9], [8, 9], [8, 12], [5, 12], [5, 14]],
            [[8, -2], [8, 3], [6, 3], [6, 7], [4, 7], [4, 9], [8, 9], [8, 12], [5, 12], [5, 14]]] },
];

// ---------- map geometry ---------------------------------------------
const tcx = c => c * TS + TS / 2, tcy = r => MY + r * TS + TS / 2;
function buildPath(wps) {
  const pts = wps.map(([c, r]) => ({ x: tcx(c), y: tcy(r) }));
  const seg = []; let L = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], len = Math.hypot(b.x - a.x, b.y - a.y);
    seg.push({ a, b, len, d0: L, dx: (b.x - a.x) / len, dy: (b.y - a.y) / len });
    L += len;
  }
  return { pts, seg, L, wps };
}
function posAt(P, d) {
  d = clamp(d, 0, P.L);
  let s = P.seg[P.seg.length - 1];
  for (const q of P.seg) if (d <= q.d0 + q.len) { s = q; break; }
  const k = d - s.d0;
  return { x: s.a.x + s.dx * k, y: s.a.y + s.dy * k, dx: s.dx, dy: s.dy };
}
let PATHS = [], BLOCK = new Set(), ROAD = new Set();
const key = (c, r) => c + ',' + r;
function setupMap(i) {
  const m = MAPS[i];
  PATHS = m.paths.map(buildPath);
  BLOCK = new Set(); ROAD = new Set();
  for (const P of PATHS) for (let k = 0; k < P.wps.length - 1; k++) {
    const [c0, r0] = P.wps[k], [c1, r1] = P.wps[k + 1];
    const n = Math.max(Math.abs(c1 - c0), Math.abs(r1 - r0));
    for (let j = 0; j <= n; j++) { const c = c0 + Math.sign(c1 - c0) * j, r = r0 + Math.sign(r1 - r0) * j; ROAD.add(key(c, r)); BLOCK.add(key(c, r)); }
    if (k === 0) { BLOCK.add(key(c0 - 1, 0)); BLOCK.add(key(c0 + 1, 0)); }   // gate posts
  }
  const [cc, cr] = m.castle;
  for (let c = cc - 1; c <= cc + 1; c++) for (let r = cr; r <= cr + 1; r++) BLOCK.add(key(c, r));
}
const inMap = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS;
// nearest road point to (x, y): where barracks soldiers stand
function nearestRoad(x, y) {
  let best = null, bd = 1e9;
  for (const P of PATHS) for (let d = 0; d <= P.L; d += 5) {
    const p = posAt(P, d);
    if (p.y < MY + 4) continue;
    const q = Math.hypot(p.x - x, p.y - y);
    if (q < bd) { bd = q; best = { x: p.x, y: p.y, dx: p.dx, dy: p.dy, dist: q }; }
  }
  return best;
}

// seeded random, so the wave preview is exactly what comes
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hpScale = n => 1 + 0.07 * (n - 1) + 0.014 * (n - 1) * (n - 1);
function waveDef(mi, n) {
  const R = mulberry(mi * 1000 + n * 7 + 13), m = MAPS[mi];
  const pool = Object.keys(EN).filter(t => !EN[t].boss && EN[t].unlock - m.shift <= n);
  const boss = n % 5 === 0;
  let budget = 5 + n * 3.2 + n * n * 0.1;
  const groups = [];
  if (boss) { groups.push({ t: 'elephant', n: 1 + Math.floor(n / 12) }); budget *= 0.5; }
  const fresh = pool.filter(t => EN[t].unlock - m.shift === n);
  const nt = Math.min(pool.length, 1 + Math.floor(R() * 2) + (n > 6 ? 1 : 0));
  const types = fresh.slice(0, nt);
  while (types.length < nt) { const t = pool[Math.floor(R() * pool.length)]; if (!types.includes(t)) types.push(t); }
  const wts = types.map(() => 0.6 + R()), tot = wts.reduce((a, b) => a + b, 0);
  types.forEach((t, i) => groups.unshift({ t, n: Math.max(1, Math.round(budget * wts[i] / tot / EN[t].cost)) }));
  // healers walk inside the other groups
  return { n, boss, groups, hpM: hpScale(n) * m.hpM, tier: n >= 12 ? 2 : 1 };
}

// ---------- canvas setup ---------------------------------------------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1, bgCanvas = null;
// OX/OY: where the 450x975 board starts on screen (CSS px). VX0..VH: the whole screen in board units.
let OX = 0, OY = 0, VX0 = 0, VY0 = 0, VW = W, VH = H;
const SPR = new Map();   // sprite cache, cleared on resize
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const wrap = document.getElementById('wrap'), cs = getComputedStyle(wrap);
  const sw = wrap.clientWidth, sh = wrap.clientHeight;
  const pl = parseFloat(cs.paddingLeft) || 0, pr = parseFloat(cs.paddingRight) || 0;
  const pt = parseFloat(cs.paddingTop) || 0, pb = parseFloat(cs.paddingBottom) || 0;
  const aw = sw - pl - pr, ah = sh - pt - pb;
  scale = Math.min(aw / W, ah / H);
  OX = pl + (aw - W * scale) / 2; OY = pt + (ah - H * scale) / 2;
  VX0 = -OX / scale; VY0 = -OY / scale; VW = sw / scale; VH = sh / scale;
  cv.style.width = sw + 'px'; cv.style.height = sh + 'px';
  cv.width = Math.round(sw * dpr); cv.height = Math.round(sh * dpr);
  bgCanvas = null; SPR.clear();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { bgCanvas = null; });

// ---------- save (this device only) -----------------------------------
const SAVE_KEY = 'legiondefense.save';
function loadSave() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  s = s && typeof s === 'object' ? s : {};
  const maps = MAPS.map((_, i) => Object.assign({ won: false, stars: 0, best: 0, bestEndless: 0 }, (s.maps || [])[i] || {}));
  return { maps, speed: s.speed || 1, auto: !!s.auto };
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ maps: G.prog, speed: G.speed, auto: G.auto })); } catch (e) {}
}
const unlocked = i => i === 0 || G.prog[i - 1].won;

// ---------- state -----------------------------------------------------
const saved = loadSave();
const G = {
  state: 'menu', t: 0, time: 0, mapI: 0, endless: false, prog: saved.maps, speed: saved.speed, auto: saved.auto,
  gold: 0, hearts: 0, wave: 0, queue: [], enemies: [], towers: [], soldiers: [], proj: [], fx: [], parts: [], floats: [],
  btns: [], sel: null, selTile: null, pick: null, banner: null, shake: 0, autoT: 0, waveActive: false, heartFlash: 0,
  stats: null, fast: false, result: null,
};
setupMap(0);

function newGame(mi, endless) {
  G.mapI = mi; G.endless = !!endless; setupMap(mi); bgCanvas = null;
  G.gold = START_GOLD; G.hearts = START_HEARTS; G.wave = 0; G.time = 0;
  G.queue = []; G.enemies = []; G.towers = []; G.soldiers = []; G.proj = []; G.fx = []; G.parts = []; G.floats = [];
  G.sel = null; G.selTile = null; G.pick = null; G.autoT = 0; G.waveActive = false; G.result = null;
  G.stats = { kills: 0, leaked: 0, earned: 0, built: 0 };
  G.state = 'play';
  showBanner(MAPS[mi].name.toUpperCase(), endless ? 'Endless: how long can you hold?' : `Hold for ${MAPS[mi].waves} waves`, '#ffe08a', 2);
}
const maxWave = () => G.endless ? Infinity : MAPS[G.mapI].waves;

// ---------- waves -----------------------------------------------------
function canCall() { return G.state === 'play' && G.queue.length === 0 && G.wave < maxWave(); }
function startWave() {
  if (!canCall()) return false;
  const early = G.enemies.some(e => !e.dead);
  if (early) { const b = 5 + G.wave * 2; addGold(b); floatText(225, PY - 40, `Early call +${b}`, '#ffe08a', 20); }
  G.wave++;
  const wd = waveDef(G.mapI, G.wave);
  let t = G.time + 0.6, k = 0;
  const groups = wd.groups.filter(g => g.t !== 'healer'), heal = wd.groups.find(g => g.t === 'healer');
  for (const gr of groups) {
    const st = t;
    for (let i = 0; i < gr.n; i++) { G.queue.push({ t, type: gr.t, hpM: wd.hpM, tier: wd.tier, p: (k++) % PATHS.length }); t += EN[gr.t].gap; }
    if (heal && gr === groups[groups.length - 1 - (wd.boss ? 1 : 0)] || (heal && groups.length === 1)) {
      // healers walk among the last regular group
      for (let i = 0; i < heal.n; i++) G.queue.push({ t: st + (t - st) * (i + 0.5) / heal.n, type: 'healer', hpM: wd.hpM, tier: wd.tier, p: (k++) % PATHS.length });
    }
    t += 1.6;
  }
  G.queue.sort((a, b) => a.t - b.t);
  G.waveActive = true; G.autoT = 0;
  showBanner(wd.boss ? 'BOSS WAVE!' : 'WAVE ' + G.wave, wd.boss ? 'A war elephant is coming' : '', wd.boss ? '#ff8a7a' : '#ffe08a', 1.3);
  return true;
}
function spawn(q) {
  const d = EN[q.type], P = PATHS[q.p], hp = d.hp * q.hpM;
  const p0 = posAt(P, 0);
  G.enemies.push({
    type: q.type, p: q.p, d: 0, off: d.boss ? 0 : rand(-7, 7), x: p0.x, y: p0.y, hp, maxHp: hp, speed: d.speed * rand(0.95, 1.05),
    armor: d.armor, dmgM: Math.sqrt(q.hpM), tier: d.boss ? 1 : q.tier, slow: 0, slowT: 0, face: 1, walk: rand(0, 1), flash: 0, atk: 0, cdT: 0,
    healT: 1, blocker: null, dead: false, gone: false,
  });
}
function addGold(n) { G.gold += n; G.stats.earned += n; }

// ---------- towers ----------------------------------------------------
function buildCheck(c, r, type) {
  if (!inMap(c, r) || BLOCK.has(key(c, r))) return 'Not here';
  if (G.towers.some(t => t.c === c && t.r === r)) return 'Taken';
  if (type === 'barracks') { const n = nearestRoad(tcx(c), tcy(r)); if (!n || n.dist > TW.barracks.lv[0].range) return 'Too far from the road'; }
  if (G.gold < TW[type].lv[0].cost) return `Need ${TW[type].lv[0].cost - G.gold} more gold`;
  return null;
}
function build(c, r, type) {
  if (G.state !== 'play' || buildCheck(c, r, type)) return null;
  G.gold -= TW[type].lv[0].cost;
  const t = { type, c, r, x: tcx(c), y: tcy(r), lv: 0, cdT: 0.2, atk: 0, face: 1, pop: 1 };
  if (type === 'barracks') t.rally = nearestRoad(t.x, t.y);
  G.towers.push(t); G.stats.built++;
  if (type === 'barracks') syncSoldiers(t);
  burst(t.x, t.y, '#fff3c4', 10, 120);
  return t;
}
function upgrade(t) {
  if (!t || t.lv >= 2) return false;
  const c = TW[t.type].lv[t.lv + 1].cost;
  if (G.gold < c) return false;
  G.gold -= c; t.lv++; t.pop = 1;

  button(g, 392, 12, 48, 40, '', () => { if (G.state === 'play') G.state = 'paused'; }, BTN_TAN);
  rr(g, 406, 23, 6, 18, 2); fs(g, '#fff', OUT, 1.6); rr(g, 418, 23, 6, 18, 2); fs(g, '#fff', OUT, 1.6);
}
function cycleSpeed() { G.speed = G.speed >= 3 ? 1 : G.speed + 1; save(); }

function enemyChips(g, wd, x0, y, maxW) {
  let x = x0;
  for (const t of EN_ORDER) {
    const gr = wd.groups.find(q => q.t === t); if (!gr) continue;
    const d = EN[t], big = t === 'elephant' || t === 'rider' || t === 'catapult';
    const w = big ? 62 : 50;
    if (x + w > x0 + maxW) break;
    rr(g, x, y - 26, w - 6, 52, 10); fs(g, d.boss ? '#ffd9c4' : '#fdf1dc', OUT, 2);
    g.save(); rr(g, x, y - 26, w - 6, 52, 10); g.clip();
    drawFigureFast(g, t, 1, d.boss ? 1 : wd.tier, x + (w - 6) / 2, y + 12, big ? 0.48 : 0.62, { face: 1, ring: false });
    g.restore();
    txt(g, '×' + gr.n, x + w - 10, y + 22, 13, '#fff', { align: 'right', lw: 3.5 });
    if (d.tag) { const s = fitSize(g, d.tag, w - 8, 9, 6); txt(g, d.tag, x + (w - 6) / 2, y - 19, s, d.boss ? '#ff6a4d' : '#2f64b3', { stroke: false }); }
    x += w;
  }
}
function drawPanel(g) {
  const y0 = MB + 10;
  if (G.sel) return drawTowerPanel(g, G.sel, y0);
  if (G.selTile) return drawBuildPanel(g, G.selTile, y0);
  // next wave preview + start button
  rr(g, 10, y0, 430, 156, 16); fs(g, 'rgba(253,241,220,.96)', OUT, 3);
  const next = G.wave < maxWave() ? waveDef(G.mapI, G.wave + 1) : null;
  if (next) {
    txt(g, next.boss ? `NEXT: WAVE ${next.n} · BOSS` : `NEXT: WAVE ${next.n}`, 24, y0 + 18, 15, next.boss ? '#c42d1f' : '#4a2f1d', { align: 'left', stroke: false });
    enemyChips(g, next, 20, y0 + 64, 240);
  } else txt(g, 'LAST WAVE!', 24, y0 + 18, 16, '#c42d1f', { align: 'left', stroke: false });
  const can = canCall(), early = can && G.enemies.some(e => !e.dead);
  const pulse = can && !early && !G.autoT ? 1 + Math.sin(G.t * 5) * 0.03 : 1;
  g.save(); g.translate(352, y0 + 52); g.scale(pulse, pulse); g.translate(-352, -(y0 + 52));
  const label = !can ? (G.wave >= maxWave() ? 'FINAL WAVE' : 'INCOMING') : early ? 'CALL EARLY' : G.autoT > 0 ? 'NEXT ' + Math.ceil(G.autoT) : G.wave === 0 ? 'START!' : 'NEXT WAVE';
  button(g, 268, y0 + 22, 164, 60, label, startWave, { enabled: can, size: fitSize(g, label, 140, 24, 14), ...(early ? BTN_GOLD : BTN_GREEN) });
  g.restore();
  button(g, 268, y0 + 94, 164, 40, G.auto ? 'AUTO: ON' : 'AUTO: OFF', () => { G.auto = !G.auto; if (G.auto && !G.waveActive && canCall() && G.wave > 0) G.autoT = 3; if (!G.auto) G.autoT = 0; save(); }, { size: 17, ...(G.auto ? BTN_BLUE : BTN_DARK) });
  const hint = G.towers.length ? 'Tap a tower to upgrade or sell it' : 'Tap any grass tile to build a tower';
  txt(g, hint, 24, y0 + 120, fitSize(g, hint, 236, 13, 9), '#8a6a4a', { align: 'left', stroke: false });
  if (G.wave === 0 && !G.towers.length) {
    g.save(); g.globalAlpha = 0.65 + Math.sin(G.t * 4) * 0.3;
    rr(g, 70, MY + 300, 310, 36, 18); fs(g, 'rgba(43,29,22,.8)');
    txt(g, 'Tap the grass to build a tower', 225, MY + 318, 16, '#ffe08a', { stroke: false });
    g.restore();
  }
}
function statLine(type, L) {
  if (type === 'barracks') return `${L.n} soldiers · ${L.hp} HP · ${L.dmg} dmg`;
  const rate = (1 / L.cd).toFixed(1);
  let s = `${L.dmg} dmg · ${rate}/s · range ${L.range}`;
  if (L.aoe) s = `${L.dmg} splash · range ${L.range}`;
  if (L.slow) s = `${L.dmg} dmg · slow ${Math.round(L.slow * 100)}%`;
  return s;
}
function drawBuildPanel(g, st, y0) {
  rr(g, 10, y0, 430, 156, 16); fs(g, 'rgba(253,241,220,.96)', OUT, 3);
  txt(g, G.pick ? 'Tap again to build' : 'Build a tower', 24, y0 + 17, 15, '#4a2f1d', { align: 'left', stroke: false });
  button(g, 400, y0 + 4, 34, 28, '✕', () => { G.selTile = null; G.pick = null; }, { size: 15, ...BTN_TAN });
  const cw = 101, gap = 6, x0 = 18;
  TW_ORDER.forEach((type, i) => {
    const x = x0 + i * (cw + gap), y = y0 + 36, h = 112, L = TW[type].lv[0];
    const err = buildCheck(st.c, st.r, type), on = G.pick === type, poor = G.gold < L.cost;
    g.save(); if (err && !on) g.globalAlpha = 0.55;
    rr(g, x, y, cw, h, 12); fs(g, on ? '#fff3c4' : '#f2dfc0', on ? '#e0892f' : OUT, on ? 4 : 2.2);
    g.save(); rr(g, x, y, cw, h, 12); g.clip();
    drawTower(g, type, 0, x + cw / 2, y + 50, { k: 0.78, noPips: true });
    g.restore();
    const nm = TW[type].short;
    txt(g, nm, x + cw / 2, y + 76, fitSize(g, nm, cw - 8, 15, 9), '#4a2f1d', { stroke: false });
    coinIcon(g, x + cw / 2 - 18, y + 96, 7.5);
    txt(g, String(L.cost), x + cw / 2 - 7, y + 97, 17, poor ? '#ff8a7a' : '#ffe08a', { align: 'left', lw: 3.5 });
    g.restore();
    G.btns.push({ x, y, w: cw, h, fn: () => {
      if (G.pick === type) { if (!err) { build(st.c, st.r, type); G.selTile = null; G.pick = null; } else floatText(tcx(st.c), tcy(st.r) - 30, err, '#ff8a7a', 16); }
      else G.pick = type;
    } });
  });
  if (G.pick) {
    const err = buildCheck(st.c, st.r, G.pick);
    const s = err || TW[G.pick].desc;
    rr(g, 140, y0 + 4, 254, 26, 10); fs(g, err ? '#ffe0da' : '#e6f3d8');
    txt(g, s, 267, y0 + 17, fitSize(g, s, 244, 13, 8), err ? '#c42d1f' : '#3f6a37', { stroke: false });
  }
}
function drawTowerPanel(g, t, y0) {
  const D = TW[t.type], L = D.lv[t.lv], N = t.lv < 2 ? D.lv[t.lv + 1] : null;
  rr(g, 10, y0, 430, 156, 16); fs(g, 'rgba(253,241,220,.96)', OUT, 3);
  rr(g, 20, y0 + 10, 96, 136, 12); fs(g, '#f2dfc0', OUT, 2);
  g.save(); rr(g, 20, y0 + 10, 96, 136, 12); g.clip();
  drawTower(g, t.type, t.lv, 68, y0 + 92, { k: 1.05, atk: t.atk, face: 1, noPips: true });
  g.restore();

  txt(g, D.name, 128, y0 + 22, 20, '#4a2f1d', { align: 'left', stroke: false });
  txt(g, 'Level ' + (t.lv + 1) + (N ? '' : ' (max)'), 128, y0 + 44, 14, '#b3281f', { align: 'left', stroke: false });

  txt(g, sl, 128, y0 + 64, fitSize(g, sl, 270, 13, 9), '#7a5334', { align: 'left', stroke: false });
  if (N) { const nl = '▲ ' + statLine(t.type, N); txt(g, nl, 128, y0 + 82, fitSize(g, nl, 270, 13, 9), '#3f8f3a', { align: 'left', stroke: false }); }
  button(g, 400, y0 + 4, 34, 28, '✕', () => { G.sel = null; }, { size: 15, ...BTN_TAN });
  if (N) {
    const ok = G.gold >= N.cost;
    button(g, 126, y0 + 96, 170, 50, '', () => upgrade(t), { enabled: ok, ...BTN_GREEN });
    g.save(); if (!ok) g.globalAlpha = 0.5;
    txt(g, 'UPGRADE', 186, y0 + 121, 19, '#fff', { lw: 4.5 });
    coinIcon(g, 248, y0 + 121, 8);
    txt(g, String(N.cost), 259, y0 + 122, 16, ok ? '#ffe08a' : '#ffb0a0', { align: 'left', lw: 3.5 });
    g.restore();
  } else { rr(g, 126, y0 + 96, 170, 50, 20); fs(g, '#e9d6b4', OUT, 2); txt(g, 'MAX LEVEL', 211, y0 + 121, 19, '#b3281f', { stroke: false }); }
  const v = Math.floor(spent(t) * SELL_BACK);
  button(g, 304, y0 + 96, 128, 50, '', () => sell(t), BTN_GOLD);
  txt(g, 'SELL', 350, y0 + 121, 19, '#fff', { lw: 4.5 });
  coinIcon(g, 384, y0 + 121, 8);
  txt(g, String(v), 395, y0 + 122, 16, '#fff', { align: 'left', lw: 3.5 });
}

function drawUI(g) {
  const st = G.state;
  if (st === 'menu') return drawMenu(g);
  drawHUD(g);
  drawPanel(g);
  if (G.banner) {
    const b = G.banner, p = b.t;
    const sc = p < 0.25 ? easeOutBack(p / 0.25) : 1, a = p > b.life - 0.3 ? (b.life - p) / 0.3 : 1;
    g.save(); g.globalAlpha = clamp(a, 0, 1); g.translate(225, MY + 250); g.scale(Math.max(0.01, sc), Math.max(0.01, sc));
    txt(g, b.text, 0, 0, fitSize(g, b.text, 420, 56, 24), b.color, { lw: 10 });
    if (b.sub) txt(g, b.sub, 0, 42, 19, '#fff', { lw: 5 });
    g.restore();
  }
  if (st === 'paused') drawPause(g);
  if (st === 'won' || st === 'over') drawEnd(g);
}
function dim(g, a) { g.fillStyle = `rgba(25,12,6,${a})`; g.fillRect(VX0, VY0, VW, VH); }
function drawPause(g) {
  dim(g, 0.6);
  G.btns = [];
  rr(g, 70, 300, 310, 330, 24); fs(g, '#fdf1dc', OUT, 4);
  txt(g, 'PAUSED', 225, 350, 48, '#ffd34d', { lw: 8 });
  txt(g, `${MAPS[G.mapI].name}${G.endless ? ' · Endless' : ''} · wave ${G.wave}`, 225, 392, 16, '#7a5334', { stroke: false });
  button(g, 110, 420, 230, 56, 'RESUME', () => { G.state = 'play'; }, { size: 26, ...BTN_GREEN });
  button(g, 110, 490, 230, 50, 'RESTART', () => newGame(G.mapI, G.endless), { size: 22, ...BTN_GOLD });
  button(g, 110, 554, 230, 50, 'MAP SELECT', toMenu, { size: 22, ...BTN_TAN });
}
function toMenu() { G.state = 'menu'; G.mapI = 0; setupMap(0); bgCanvas = null; G.enemies = []; G.towers = []; G.soldiers = []; G.proj = []; G.parts = []; G.floats = []; G.banner = null; }
function drawEnd(g) {
  dim(g, 0.62);
  G.btns = [];
  const R = G.result, won = R.won;
  rr(g, 40, 230, 370, 470, 24); fs(g, '#fdf1dc', OUT, 4);
  if (won) for (let i = 0; i < 3; i++) star(g, 165 + i * 60, 290 - (i === 1 ? 10 : 0), i === 1 ? 30 : 24, i < R.stars);
  else heartIcon(g, 225, 290, 26, '#6b5d52');
  const head = won ? 'VICTORY!' : G.endless ? 'GAME OVER' : 'DEFEAT';
  txt(g, head, 225, 362, 50, won ? '#ffd34d' : '#ff6a4d', { lw: 8 });
  const sub = won ? `${MAPS[G.mapI].name} is safe!` : G.endless ? `You held ${R.cleared} waves` : 'The castle has fallen';
  txt(g, sub, 225, 402, fitSize(g, sub, 330, 18, 11), '#7a5334', { stroke: false });
  const pr = G.prog[G.mapI];
  const rows = [['Waves cleared', R.cleared], ['Enemies defeated', G.stats.kills], ['Hearts left', G.hearts], ['Gold earned', G.stats.earned],
    G.endless ? ['Best endless', pr.bestEndless] : ['Best wave', pr.best]];
  rows.forEach(([k, v], i) => {
    const y = 438 + i * 30;
    txt(g, k, 76, y, 17, '#4a2f1d', { align: 'left', stroke: false });
    txt(g, String(v), 374, y, 18, '#b3281f', { align: 'right', stroke: false });
    if (i < rows.length - 1) line(g, 76, y + 15, 374, y + 15, 'rgba(90,60,30,.18)', 1);
  });
  const nextMap = won && !G.endless && G.mapI + 1 < MAPS.length;
  if (nextMap) {
    txt(g, `${MAPS[G.mapI + 1].name} unlocked!`, 225, 590, 17, '#3f8f3a', { stroke: false });
    button(g, 60, 612, 160, 56, 'NEXT MAP', () => newGame(G.mapI + 1, false), { size: 22, ...BTN_GREEN });
    button(g, 230, 612, 160, 56, 'MENU', toMenu, { size: 22, ...BTN_TAN });
  } else {
    if (won && !G.endless) txt(g, 'Endless mode unlocked for this map', 225, 590, 15, '#3f8f3a', { stroke: false });
    button(g, 60, 612, 160, 56, won ? 'ENDLESS' : 'RETRY', () => newGame(G.mapI, won ? true : G.endless), { size: 22, ...BTN_GREEN });
    button(g, 230, 612, 160, 56, 'MENU', toMenu, { size: 22, ...BTN_TAN });
  }
}

// ---------- menu / map select ----------------------------------------
function miniMap(g, mi, x, y, w, h) {
  const m = MAPS[mi], th = THEME[m.theme], k = Math.min(w / (COLS * TS), h / (ROWS * TS));
  const ox = x + (w - COLS * TS * k) / 2, oy = y + (h - ROWS * TS * k) / 2;
  rr(g, ox, oy, COLS * TS * k, ROWS * TS * k, 6); fs(g, th.g1, OUT, 2);
  g.save(); rr(g, ox, oy, COLS * TS * k, ROWS * TS * k, 6); g.clip();
  for (const [lw, col] of [[7, th.edge], [5, th.road]]) for (const P of m.paths) {
    g.beginPath(); P.forEach(([c, r], i) => { const px = ox + (c + 0.5) * TS * k, py = oy + (r + 0.5) * TS * k; i ? g.lineTo(px, py) : g.moveTo(px, py); });
    g.strokeStyle = col; g.lineWidth = lw; g.lineJoin = 'round'; g.stroke();
  }
  g.restore();
  const cx = ox + (m.castle[0] + 0.5) * TS * k, cy = oy + (m.castle[1] + 1) * TS * k;
  rr(g, cx - 8, cy - 7, 16, 11, 2); fs(g, STONE, OUT, 1.5); tri(g, cx, cy - 15, cx - 6, cy - 7, cx + 6, cy - 7); fs(g, PAL[0].main, OUT, 1.2);
}
function drawMenu(g) {
  dim(g, 0.35);
  txt(g, 'LEGION', 225, 92, 70, '#ffd34d', { lw: 11 });
  txt(g, 'DEFENSE', 225, 154, 62, '#6aa6f0', { lw: 11 });
  txt(g, 'Build towers. Stop the blue legion. Save the castle!', 225, 196, fitSize(g, 'Build towers. Stop the blue legion. Save the castle!', 400, 16, 10), '#fdf1dc', { lw: 4 });
  MAPS.forEach((m, i) => {
    const y = 222 + i * 186, x = 22, w = 406, h = 172, pr = G.prog[i], open = unlocked(i);
    rr(g, x, y + 5, w, h, 20); fs(g, 'rgba(0,0,0,.35)');
    rr(g, x, y, w, h, 20); fs(g, open ? '#fdf1dc' : '#cfc3b0', OUT, 3);
    miniMap(g, i, x + 12, y + 12, 92, 148);
    txt(g, m.name, x + 118, y + 28, 26, open ? '#4a2f1d' : '#7a6a5a', { align: 'left', stroke: false });
    txt(g, `${m.waves} waves${m.paths.length > 1 ? ' · 2 gates' : ''}`, x + 118, y + 54, 14, '#8a6a4a', { align: 'left', stroke: false });
    for (let s = 0; s < 3; s++) star(g, x + 380 - (2 - s) * 26, y + 30, 11, s < pr.stars);
    if (!open) {
      txt(g, `Beat ${MAPS[i - 1].name} to unlock`, x + 118, y + 92, 16, '#7a6a5a', { align: 'left', stroke: false });
      g.save(); g.translate(x + 300, y + 118);
      rr(g, -16, -8, 32, 26, 5); fs(g, '#8a8f99', OUT, 2.4);
      g.beginPath(); g.arc(0, -8, 10, Math.PI, 0); g.strokeStyle = OUT; g.lineWidth = 7; g.stroke(); g.strokeStyle = '#a7acb5'; g.lineWidth = 3.5; g.stroke();
      circ(g, 0, 4, 3.5); fs(g, OUT);
      g.restore();
      return;
    }
    const info = pr.won ? `Beaten! Best endless: ${pr.bestEndless}` : pr.best ? `Best: wave ${pr.best} of ${m.waves}` : 'Not played yet';
    txt(g, info, x + 118, y + 78, fitSize(g, info, 276, 14, 10), pr.won ? '#3f8f3a' : '#b3281f', { align: 'left', stroke: false });
    button(g, x + 118, y + 100, 140, 56, 'PLAY', () => newGame(i, false), { size: 26, ...BTN_GREEN });
    button(g, x + 266, y + 100, 128, 56, 'ENDLESS', () => newGame(i, true), { size: 19, enabled: pr.won, ...BTN_BLUE });
    if (!pr.won) txt(g, 'win to unlock', x + 330, y + 166, 11, '#8a6a4a', { stroke: false });
  });
  const lineUp = ['wolf', 'spearman', 'swordsman', 'healer', 'rider', 'elephant'];
  let x = 40;
  for (const t of lineUp) { const s = t === 'elephant' ? 0.62 : 0.78; drawFigureFast(g, t, 1, 1, x, 812 + 150, s, { face: -1, walk: G.t + x }); x += t === 'elephant' ? 70 : t === 'rider' ? 66 : 52; }
  drawTower(g, 'archer', 2, 410, 948, { k: 0.85, atk: (G.t * 1.5) % 1 });
  txt(g, 'Progress is saved on this device', 225, 900, 13, 'rgba(253,241,220,.75)', { stroke: false });
}

// =====================================================================
//  UPDATE & LOOP
// =====================================================================
function update(dt) {
  G.t += dt;
  G.shake *= Math.pow(0.02, dt); if (G.shake < 0.1) G.shake = 0;
  for (const p of G.parts) {
    p.t += dt;
    if (p.type === 'coin') continue;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'spark') p.vy += 260 * dt;
    if (p.type === 'puff') { p.vx *= 0.94; p.vy *= 0.94; }
  }
  if (G.parts.length > 400) G.parts.splice(0, G.parts.length - 400);
  G.parts = G.parts.filter(p => p.t < p.life);
  for (const f of G.floats) { f.t += dt; f.y -= 28 * dt; }
  G.floats = G.floats.filter(f => f.t < f.life);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.life) G.banner = null; }
  if (G.state === 'play') stepGame(dt);
  else if (G.state === 'won' || G.state === 'over') for (const t of G.towers) t.atk = Math.max(0, t.atk - dt * 3);
}

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; acc += dt;
  while (acc >= STEP) {
    const n = G.state === 'play' ? G.speed : 1;
    for (let i = 0; i < n; i++) update(STEP);
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}

// ---------- input -----------------------------------------------------
function toL(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - OX) / scale, y: (e.clientY - r.top - OY) / scale };
}
function tapMap(p) {
  if (G.state !== 'play' || p.y < MY || p.y >= MB) return false;
  const c = Math.floor(p.x / TS), r = Math.floor((p.y - MY) / TS);
  // a tower's art reaches into the tile above it, so a tap there also picks it
  let t = G.towers.find(q => q.c === c && q.r === r);
  if (!t && !(inMap(c, r) && !BLOCK.has(key(c, r)))) t = G.towers.find(q => q.c === c && q.r === r + 1);
  if (t) { G.sel = G.sel === t ? null : t; G.selTile = null; G.pick = null; return true; }
  G.sel = null;
  if (inMap(c, r) && !BLOCK.has(key(c, r))) {
    if (G.selTile && G.selTile.c === c && G.selTile.r === r) { G.selTile = null; G.pick = null; }
    else G.selTile = { c, r };
  } else { G.selTile = null; G.pick = null; }
  return true;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toL(e);
  for (let i = G.btns.length - 1; i >= 0; i--) {
    const b = G.btns[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; }
  }
  tapMap(p);
});
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (G.state === 'play') {
    if (k === ' ' || k === 'enter') { e.preventDefault(); startWave(); }
    else if (k === 's') cycleSpeed();
    else if (k === 'p' || k === 'escape') G.state = 'paused';
    else if (k >= '1' && k <= '4' && G.selTile) { const ty = TW_ORDER[+k - 1]; if (G.pick === ty) { build(G.selTile.c, G.selTile.r, ty); G.selTile = null; G.pick = null; } else G.pick = ty; }
    else if (k === 'u' && G.sel) upgrade(G.sel);
  } else if (G.state === 'paused' && (k === 'p' || k === 'escape' || k === ' ')) G.state = 'play';
});
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') G.state = 'paused'; });

// exposed for automated testing
window.TD = {
  G, MAPS, TW, EN, newGame, build, upgrade, sell, startWave, waveDef, buildCheck, toMenu, tapMap, save, loadSave,
  // run the game without drawing, as fast as possible
  sim(seconds) { G.fast = true; const n = Math.round(seconds / STEP); for (let i = 0; i < n && G.state === 'play'; i++) update(STEP); G.fast = false; return G.state; },
};

requestAnimationFrame(frame);
</script>
