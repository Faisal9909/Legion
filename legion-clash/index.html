<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Legion Clash</title>
<!-- full-screen when opened from the iPhone home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Legion Clash">
<meta name="theme-color" content="#2b1d14">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #2b1d14; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  /* keep the game clear of the notch, the Dynamic Island and the home bar */
  /* #wrap only measures the safe area; the canvas covers the whole screen and the
     game board is placed inside the safe area, with the arena stands drawn out to the edges */
  #wrap { position: fixed; inset: 0; box-sizing: border-box; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; }
</style>
</head>
<body>
<div id="wrap"></div><canvas id="c"></canvas>
<script>
'use strict';

// =====================================================================
//  LEGION CLASH
//  Both armies start empty. Each round both sides pick 3 cards
//  (add soldiers, power a unit type UP, or a battle rule), then the
//  armies clash on their own. Take all 3 enemy wreaths to win.
// =====================================================================

// ---------- constants & utils ----------------------------------------
const W = 450, H = 975;
const F = "'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif";
const OUT = '#2a1d18';
const LW = 2.3;
const AR = { x: 44, y: 172, w: 362, h: 630 };
const MID = AR.y + AR.h / 2;
const COIN_POS = { x: 36, y: 946 };
const STEP = 1 / 60;
const PICKS_PER_ROUND = 3;
const T2_SIZE = 1.18;
const MARCH_T = 1.8;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }
function ell(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function tri(g, x1, y1, x2, y2, x3, y3) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); g.closePath(); }
function fs(g, fill, stroke, lw) {
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || LW; g.stroke(); }
}
function line(g, x1, y1, x2, y2, color, lw) {
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = color; g.lineWidth = lw; g.stroke();
}
// a stroke with a dark outline under it (for spears, bows, trunks)
function oline(g, pts, color, lw) {
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  if (pts.length === 4) g.lineTo(pts[2], pts[3]); else g.quadraticCurveTo(pts[2], pts[3], pts[4], pts[5]);
  g.strokeStyle = OUT; g.lineWidth = lw + 2.2; g.stroke();
  g.strokeStyle = color; g.lineWidth = lw; g.stroke();
}
function txt(g, s, x, y, size, fill, o = {}) {
  g.font = `400 ${size}px ${F}`;
  g.textAlign = o.align || 'center'; g.textBaseline = 'middle';
  if (o.stroke !== false) {
    g.lineJoin = 'round'; g.lineWidth = o.lw || Math.max(3, size * 0.18);
    g.strokeStyle = o.stroke || OUT; g.strokeText(s, x, y);
  }
  g.fillStyle = fill; g.fillText(s, x, y);
}
function fitSize(g, s, maxW, size, min) {
  while (size > min) { g.font = `400 ${size}px ${F}`; if (g.measureText(s).width <= maxW) break; size--; }
  return size;
}

// ---------- data ------------------------------------------------------
// h = head-top height (for health bars), space = spacing in the formation
const UNITS = {
  swordsman: { single: 'Swordsman', plural: 'Swordsmen', role: 'Tough front-line fighters', upDesc: 'Much tougher and stronger',
    hp: 100, dmg: 12, reach: 4, speed: 42, cd: 0.85, size: 1.15, rad: 8.5, space: 20, mass: 1.3, armor: 0.2, kind: 'melee', h: 42, add: 10, rar: 0, up: { hp: 1.8, dmg: 1.6 } },
  spearman: { single: 'Spearman', plural: 'Spearmen', role: 'Long reach. 2.5× vs riders', upDesc: 'Tower shields, much tougher',
    hp: 90, dmg: 11, reach: 15, speed: 38, cd: 1.0, size: 1.15, rad: 8.5, space: 20, mass: 1.3, armor: 0.15, kind: 'melee', h: 36, add: 7, rar: 0, antiBig: true, up: { hp: 1.9, dmg: 1.5, armor: 0.4 } },
  archer: { single: 'Archer', plural: 'Archers', role: 'Shoot from far away', upDesc: 'Fire arrows that splash',
    hp: 45, dmg: 9, range: 170, speed: 36, cd: 1.2, size: 1.08, rad: 8, space: 19, mass: 1, armor: 0, kind: 'arrow', h: 38, add: 8, rar: 0, up: { hp: 1.5, dmg: 1.4, splash: 20 } },
  wolf: { single: 'Wolf', plural: 'Wolves', role: 'Cheap and very fast', upDesc: 'Bigger and faster',
    hp: 56, dmg: 8, reach: 3, speed: 82, cd: 0.5, size: 1.05, rad: 8, space: 21, mass: 0.9, armor: 0, kind: 'melee', h: 30, add: 12, rar: 0, up: { hp: 1.8, dmg: 1.7, speed: 1.2 } },
  rider: { single: 'Rider', plural: 'Riders', role: 'Fast. First hit does 3×', upDesc: 'Armoured horses',
    hp: 195, dmg: 17, reach: 5, speed: 86, cd: 1.0, size: 1.08, rad: 13, space: 31, mass: 2.6, armor: 0.15, kind: 'melee', charge: true, h: 50, add: 4, rar: 1, up: { hp: 2.0, dmg: 1.7, armor: 0.35 } },
  healer: { single: 'Healer', plural: 'Healers', role: 'Heal nearby soldiers', upDesc: 'Heal twice as much',
    hp: 55, dmg: 0, heal: 12, range: 65, speed: 40, cd: 1.5, size: 1.08, rad: 8, space: 20, mass: 1, armor: 0, kind: 'heal', h: 38, add: 3, rar: 1, up: { hp: 1.6, heal: 1.9 } },
  catapult: { single: 'Catapult', plural: 'Catapults', role: 'Huge range, splash damage', upDesc: 'Fire stones, bigger blast',
    hp: 130, dmg: 32, range: 300, aoe: 42, speed: 14, cd: 3.4, size: 1.1, rad: 15, space: 42, mass: 5, armor: 0.1, kind: 'stone', h: 36, add: 2, rar: 1, up: { hp: 1.5, dmg: 1.3, aoe: 1.25 } },
  elephant: { single: 'War Elephant', plural: 'War Elephants', role: 'Giant tank, tramples crowds', upDesc: '',
    hp: 900, dmg: 28, reach: 6, speed: 30, cd: 1.4, size: 1.1, rad: 22, space: 58, mass: 12, armor: 0.2, kind: 'stomp', h: 72, add: 1, rar: 2, up: null },
};
const TYPES = Object.keys(UNITS);
const ORDER = ['elephant', 'rider', 'swordsman', 'wolf', 'spearman', 'healer', 'archer', 'catapult'];
const RULES = {
  shields:   { title: 'Shields Up',  desc: '40% less arrow + stone damage', rar: 2 },
  battlecry: { title: 'Battle Cry',  desc: '+15% damage for all', rar: 2 },
  gold:      { title: 'Bonus Gold',  desc: '+8 coins for rerolls', rar: 1 },
  drums:     { title: 'War Drums',   desc: 'Everyone attacks 20% faster', rar: 2 },
};
const RAR_W = [60, 30, 12], UP_W = 34;
// who beats whom, measured: 3 cards vs 3 cards, 12 simulated fights each (win rate 75%+)
const COUNTERS = {
  swordsman: ['spearman', 'archer', 'wolf', 'rider', 'catapult'], spearman: ['rider', 'elephant', 'archer', 'catapult'],
  archer: ['healer'], wolf: ['spearman', 'archer', 'rider', 'catapult'], rider: ['archer', 'catapult'],
  healer: [], catapult: ['archer', 'healer'], elephant: ['swordsman', 'wolf', 'rider', 'archer', 'catapult'],
};
const CHIEFS = ['Grog the Bold', 'Ulf Ironbeard', 'Big Brenna', 'Harald Axehand', 'Olga Stormborn', 'Borg the Huge', 'The Wolf King'];

const PAL = [
  { main: '#e0453b', dark: '#8e1f1a', light: '#ff9b8f', tunic: '#e0453b', skin: '#f6c99a', metal: '#c9d2dc', gold: '#f6c343', wood: '#9a6434', ring: 'rgba(224,69,59,.75)', hair: '#5b3620' },
  { main: '#3b7dd8', dark: '#1d4382', light: '#9cc6ff', tunic: '#8a5a32', skin: '#f7d7b8', metal: '#a9b1bb', gold: '#f6c343', wood: '#86582d', ring: 'rgba(59,125,216,.75)', hair: '#e0823a' },
];

// ---------- canvas setup ---------------------------------------------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1, bgCanvas = null;
// OX/OY: where the 450×975 board starts on screen (CSS px). VX0..VH: the whole screen in board units.
let OX = 0, OY = 0, VX0 = 0, VY0 = 0, VW = W, VH = H;
const SPR = new Map();   // figure sprite cache, cleared on resize
let GEN = 0;             // bumps on resize so cached card images rebuild
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  // fit inside the safe area (notch, Dynamic Island, home bar)
  const wrap = document.getElementById('wrap'), cs = getComputedStyle(wrap);
  const sw = wrap.clientWidth, sh = wrap.clientHeight;
  const pl = parseFloat(cs.paddingLeft) || 0, pr = parseFloat(cs.paddingRight) || 0;
  const pt = parseFloat(cs.paddingTop) || 0, pb = parseFloat(cs.paddingBottom) || 0;
  const aw = sw - pl - pr, ah = sh - pt - pb;
  scale = Math.min(aw / W, ah / H);
  OX = pl + (aw - W * scale) / 2; OY = pt + (ah - H * scale) / 2;
  VX0 = -OX / scale; VY0 = -OY / scale; VW = sw / scale; VH = sh / scale;
  cv.style.width = sw + 'px'; cv.style.height = sh + 'px';
  cv.width = Math.round(sw * dpr); cv.height = Math.round(sh * dpr);
  bgCanvas = null;
  SPR.clear(); GEN++;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { bgCanvas = null; });

// ---------- save ------------------------------------------------------
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem('legionclash.save')); if (s) return s; } catch (e) {}
  return { best: 0, streak: 0, opp: 0, speed: 2, speedC: 1, mode: 'auto' };
}
function save() {
  try { localStorage.setItem('legionclash.save', JSON.stringify({ best: G.best, streak: G.streak, opp: G.opp, speed: G.speedA, speedC: G.speedC, mode: G.mode })); } catch (e) {}
}

// ---------- state -----------------------------------------------------
const saved = loadSave();
const G = {
  state: 'title', t: 0, round: 0, opp: saved.opp || 0, streak: saved.streak || 0, best: saved.best || 0,
  P: null, E: null, pv: [[], []], units: [], proj: [], fx: [], parts: [], floats: [], timers: [],
  btns: [], offer: [], draftT: 0, draftMax: 15, draftAge: 0, mercy: false, freeRerolls: 0, pickNo: 0,
  picked: null, revealT: 0, landT: 0, formT: 0, bt: 0, bstart: 0, ending: false, rt: 0, lastWinner: -1,
  banner: null, thumb: null, shake: 0, excite: 0.25, speed: 1, speedA: saved.speed || 2, speedC: saved.speedC || 1, mode: saved.mode || 'auto', skip: false,
  sel: 0, ord: {}, boost: [0, 0], boostCd: [0, 0], stats: null, chief: '', defeated: '', won: false,
};
const sideOf = i => i ? G.E : G.P;
const chiefName = n => CHIEFS[n % CHIEFS.length] + (n >= CHIEFS.length ? ' ' + (Math.floor(n / CHIEFS.length) + 1) : '');
const count = S => Object.values(S.army).reduce((a, b) => a + b, 0);
const scaleOf = (S, t) => UNITS[t].size * (S.tiers[t] === 2 ? T2_SIZE : 1);
function later(t, fn) { G.timers.push({ t, fn }); }
function newSide() { return { army: {}, tiers: {}, mods: { dmg: 1, hp: 1, cd: 1, shields: false }, wreaths: 3, coins: 0 }; }

// ---------- formation -------------------------------------------------
function formation(S, si) {
  const groups = []; let total = 0;
  for (const t of ORDER) {
    const n = S.army[t] || 0; if (!n) continue;
    const sp = UNITS[t].space * scaleOf(S, t);
    const per = Math.max(1, Math.floor(330 / sp)), lines = Math.ceil(n / per), depth = sp * 0.72;
    groups.push({ t, n, sp, per, lines, depth });
    total += lines * depth + 5;
  }
  const avail = si === 0 ? 235 : 200, f = total > avail ? avail / total : 1;
  const out = []; let off = 0;
  for (const g of groups) {
    for (let i = 0; i < g.n; i++) {
      const ln = Math.floor(i / g.per), idx = i % g.per;
      const inLine = ln < g.lines - 1 ? g.per : g.n - ln * g.per;
      const x = 225 + (idx - (inLine - 1) / 2) * g.sp + (ln % 2 ? g.sp * 0.22 : 0) + ((i * 37) % 7 - 3) * 0.7;
      const d = off + ln * g.depth * f + ((i * 53) % 5 - 2) * 0.6;
      out.push({ type: g.t, x, y: si === 0 ? MID + 62 + d : MID - 62 - d });
    }
    off += (g.lines * g.depth + 5) * f;
  }
  return out;
}
// keeps existing figures where they are, new ones fly in from (fx, fy)
function relayout(si, fx, fy) {
  const S = sideOf(si), byType = {};
  for (const e of G.pv[si]) (byType[e.type] = byType[e.type] || []).push(e);
  const used = {}, out = []; let k = 0;
  for (const p of formation(S, si)) {
    const i = used[p.type] || 0; used[p.type] = i + 1;
    const prev = (byType[p.type] || [])[i];
    if (prev) { prev.tx = p.x; prev.ty = p.y; out.push(prev); }
    else out.push({ type: p.type, tx: p.x, ty: p.y, dx: fx == null ? p.x : fx + rand(-24, 24), dy: fy == null ? p.y : fy + rand(-16, 16), delay: fx == null ? 0 : (k++) * 0.035, pop: 0, ph: rand(0, 6.28) });
  }
  G.pv[si] = out;
}

// ---------- cards -----------------------------------------------------
function makeOffer(S, k) {
  const pool = [];
  for (const t of TYPES) {
    const d = UNITS[t];
    const n = d.add + Math.floor((G.round - 1) / 3) * Math.ceil(d.add / 3);
    pool.push({ kind: 'add', id: 'add-' + t, unit: t, n, w: RAR_W[d.rar] });
    if (d.up && (S.army[t] || 0) > 0 && S.tiers[t] !== 2) pool.push({ kind: 'up', id: 'up-' + t, unit: t, w: UP_W });
  }
  if (G.round >= 2) for (const id in RULES) {
    if (id === 'shields' && S.mods.shields) continue;
    pool.push({ kind: 'rule', id, w: RAR_W[RULES[id].rar] });
  }
  const out = [], used = new Set();
  while (out.length < k) {
    const avail = pool.filter(c => !used.has(c.id)); if (!avail.length) break;
    let tot = 0; for (const c of avail) tot += c.w;
    let r = Math.random() * tot, ch = avail[0];
    for (const c of avail) { r -= c.w; if (r <= 0) { ch = c; break; } }
    used.add(ch.id); out.push({ ...ch });
  }
  if (!out.some(c => c.kind === 'add')) {
    const t = pick(['swordsman', 'spearman', 'archer', 'wolf']);
    out[out.length - 1] = { kind: 'add', id: 'add-' + t, unit: t, n: UNITS[t].add, w: 0 };
  }
  return out;
}
function cardTitle(c) {
  if (c.kind === 'add') return `+${c.n} ${c.n === 1 ? UNITS[c.unit].single : UNITS[c.unit].plural}`;
  if (c.kind === 'up') return `${UNITS[c.unit].plural} UP!`;
  return RULES[c.id].title;
}
function cardDesc(c) {
  if (c.kind === 'add') return UNITS[c.unit].role;
  if (c.kind === 'up') return UNITS[c.unit].upDesc;
  return RULES[c.id].desc;
}
function applyCard(S, si, c, fx, fy) {
  if (c.kind === 'add') {
    S.army[c.unit] = (S.army[c.unit] || 0) + c.n;
    if (!S.tiers[c.unit]) S.tiers[c.unit] = 1;
    relayout(si, fx, fy);
    if (si === 0) G.stats.maxArmy = Math.max(G.stats.maxArmy, count(S));
  } else if (c.kind === 'up') {
    S.tiers[c.unit] = 2;
    relayout(si);
    for (const e of G.pv[si]) if (e.type === c.unit) { e.pop = 1; burst(e.tx, e.ty - 16, '#f6c343', 4, 90); }
  } else {
    if (c.id === 'shields') S.mods.shields = true;
    if (c.id === 'battlecry') S.mods.dmg *= 1.15;
    if (c.id === 'gold') S.coins += 8;
    if (c.id === 'drums') S.mods.cd *= 0.83;
  }
  floatText(fx, fy - 30, cardTitle(c), si ? '#9cc6ff' : '#ffe08a', si ? 18 : 24);
}

// ---------- flow ------------------------------------------------------
function newMatch(mode) {
  if (mode === 'auto' || mode === 'cmd') G.mode = mode;
  G.speed = G.mode === 'cmd' ? G.speedC : G.speedA; save();
  G.timers = []; G.parts = []; G.floats = []; G.units = []; G.proj = []; G.fx = []; G.pv = [[], []];
  G.P = newSide(); G.E = newSide();
  G.round = 1; G.lastWinner = -1; G.freeRerolls = 0; G.banner = null; G.thumb = null;
  G.stats = { slain: 0, lost: 0, maxArmy: 0, roundsWon: 0 };
  G.chief = chiefName(G.opp);
  G.E.mods.hp = 0.9 + 0.08 * G.opp; G.E.mods.dmg = 0.92 + 0.05 * G.opp;
  startDraft();
}
function startDraft() {
  G.mercy = G.lastWinner === 1;
  if (G.mercy) G.freeRerolls++;
  G.pickNo = 0;
  nextPick();
}
function nextPick() {
  G.state = 'draft';
  G.offer = makeOffer(G.P, G.mercy ? 4 : 3);
  G.draftT = G.draftMax; G.draftAge = 0;
}
function reroll() {
  if (G.state !== 'draft') return;
  if (G.freeRerolls > 0) G.freeRerolls--;
  else if (G.P.coins >= 3) G.P.coins -= 3;
  else return;
  G.offer = makeOffer(G.P, G.offer.length); G.draftAge = 0;
}
function pickCard(i) {
  if (G.state !== 'draft' || !G.offer[i]) return;
  G.picked = { card: G.offer[i], i, n: G.offer.length };
  G.state = 'reveal'; G.revealT = 0;
}
function finishPick() {
  applyCard(G.P, 0, G.picked.card, 225, MID + 90);
  G.pickNo++;
  aiDraft(G.pickNo >= PICKS_PER_ROUND);
  G.picked = null;
  if (G.pickNo < PICKS_PER_ROUND) { G.state = 'landing'; G.landT = 0.4; }
  else { G.state = 'formation'; G.formT = 0; }
}

function aiScore(c) {
  const E = G.E, P = G.P;
  let s = rand(0, 2.5);
  if (c.kind === 'add') {
    s += 3;
    for (const t of COUNTERS[c.unit]) s += (P.army[t] || 0) * 0.25 * (P.tiers[t] === 2 ? 1.5 : 1);
    if (c.unit === 'elephant') s += 3;
    if (c.unit === 'healer' && count(E) < 12) s -= 3;
  } else if (c.kind === 'up') {
    s += 2 + (E.army[c.unit] || 0) * 0.5;
  } else if (c.id === 'gold') s -= 10;
  else if (c.id === 'shields') s += 1 + (P.army.archer || 0) * 0.4;
  else s += 1 + count(E) * 0.08;
  return s;
}
function aiDraft(lastOfRound) {
  let picks = 1;
  if (lastOfRound && G.round > 1) {
    if (G.opp >= 3 && G.round % 2 === 0) picks++;
    if (G.opp >= 5) picks++;
  }
  for (let p = 0; p < picks; p++) later(0.12 + p * 0.22, () => {
    const off = makeOffer(G.E, G.lastWinner === 0 ? 4 : 3);
    let best = off[0], bs = -1e9;
    for (const c of off) { const s = aiScore(c); if (s > bs) { bs = s; best = c; } }
    applyCard(G.E, 1, best, 225, MID - 130);
  });
}

function skipBattle() {
  if (G.state !== 'battle' || G.ending) return;
  G.bstart = 0; G.skip = true;
  for (let n = 0; !G.ending && n < 60 * 50; n++) stepBattle(STEP);
  G.skip = false;
  G.parts = G.parts.filter(p => p.type === 'coin'); G.fx = []; G.proj = []; G.shake = 0;
}
function cycleSpeed() {
  G.speed = G.speed >= 3 ? 1 : G.speed + 1;
  if (G.mode === 'cmd') G.speedC = G.speed; else G.speedA = G.speed;
  save();
}
// ---------- command mode ----------------------------------------------
const GROUPS = [
  { name: 'ALL', types: null },
  { name: 'FRONT', types: ['swordsman', 'spearman', 'elephant'] },
  { name: 'FAST', types: ['wolf', 'rider'] },
  { name: 'RANGED', types: ['archer', 'catapult'] },
  { name: 'HEAL', types: ['healer'] },
];
const FOCUS_R = 80, BOOST_T = 4, BOOST_CD = 14;
const groupHas = (gi, t) => !GROUPS[gi].types || GROUPS[gi].types.includes(t);

// ---------- battle ----------------------------------------------------
const SOFT = { archer: 1, catapult: 1, healer: 1 };
// archers and catapults first look for enemy archers, catapults or healers they can already reach
function rangedTarget(u) {
  let best = null, bd = u.range * u.range;
  for (const e of G.units) {
    if (e.dead || e.side === u.side || !SOFT[e.type]) continue;
    const d = (e.x - u.x) ** 2 + (e.y - u.y) ** 2;
    if (d < bd) { bd = d; best = e; }
  }

}
function nearestEnemy(u) {
  let best = null, bd = 1e12;
  for (const e of G.units) {
    if (e.dead || e.side === u.side) continue;
    const d = (e.x - u.x) ** 2 + (e.y - u.y) ** 2;
    if (d < bd) { bd = d; best = e; }
  }

}

const HC = 44, GRID = new Map();
function separate() {
  const map = GRID;
  for (const a of map.values()) a.length = 0;
  for (const u of G.units) {
    if (u.dead) continue;
    const k = ((u.x / HC) | 0) + ((u.y / HC) | 0) * 64;
    let a = map.get(k); if (!a) map.set(k, a = []); a.push(u);
  }
  for (const u of G.units) {
    if (u.dead) continue;
    const cx = (u.x / HC) | 0, cy = (u.y / HC) | 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const a = map.get(cx + ox + (cy + oy) * 64); if (!a) continue;
      for (const b of a) {

        const dx = b.x - u.x, dy = b.y - u.y, rs = u.r + b.r;
        if (dx > rs || dx < -rs || dy > rs || dy < -rs) continue;

}

// true once the front lines are close: the enemy uses its charge then
function ST_contact() {
  for (const u of G.units) if (!u.dead && u.side === 1 && u.target && !u.target.dead && Math.abs(u.target.y - u.y) < 60) return true;
  return false;
}
const boostOf = u => G.boost[u.side] > 0 ? 1 : 0;
function stepBattle(dt) {

  if (G.mode === 'cmd' && G.boostCd[1] <= 0 && ST_contact()) useCharge(1);

  const U = G.units;
  for (const u of U) if (!u.dead) stepUnit(u, dt);
  separate();
  for (const u of U) {
    if (u.dead) continue;
    u.x = clamp(u.x, AR.x + u.r, AR.x + AR.w - u.r);
    u.y = clamp(u.y, AR.y + UNITS[u.type].h * u.s * 0.55, AR.y + AR.h - u.r * 0.5);
  }
  stepProj(dt);

function stepUnit(u, dt) {

function stepHealer(u, dt, d) {

function attack(u, t, dx, dy, dd) {

function stepProj(dt) {

  const skins = ['#f0c79a', '#dba678', '#b98252', '#f4d5b5', '#8d5a3b'];
  const hairs = ['#3b2a1f', '#6b4527', '#b8612a', '#d9c48f', '#2a1d18'];
  crowd = [];
  const add = (x, y) => crowd.push({ x, y, tun: pick(tun), skin: pick(skins), hair: pick(hairs), ph: rand(0, 6.28), sp: rand(6, 10), arm: Math.random() < 0.55 });
  const x0 = VX0 + 8, x1 = VX0 + VW - 8, y1 = VY0 + VH - 6;
  for (let y = 190; y < 800; y += 21) {
    for (let x = 32; x >= x0; x -= 20) add(x + rand(-2, 2), y + rand(-2, 2));
    for (let x = 418; x <= x1; x += 20) add(x + rand(-2, 2), y + rand(-2, 2));
  }
  for (let y = 92; y < 160; y += 20) for (let x = 12 - 18 * Math.ceil((12 - x0) / 18); x < 150; x += 18) { add(x, y); add(W - x, y); }
  for (let y = 830; y < y1; y += 21) for (let x = 12 - 18 * Math.ceil((12 - x0) / 18); x <= x1; x += 18) add(x + rand(-2, 2), y);
  crowd.sort((a, b) => a.y - b.y);
  CR_TUN = groupBy('tun'); CR_SKIN = groupBy('skin'); CR_HAIR = groupBy('hair');
}

// batched by colour: ~20 fills per frame instead of ~1,400 separate paths
const HA0 = Math.PI * 1.05, HA1 = Math.PI * 1.95, HCX = Math.cos(HA0) * 5.8, HCY = Math.sin(HA0) * 5.8;
function drawCrowd(g) {
  const ex = G.excite, T = G.t;
  for (const m of crowd) { m.bob = -Math.max(0, Math.sin(T * m.sp + m.ph)) * 3.5 * ex; m.yy = m.y + m.bob; }
  if (ex > 0.5) {
    g.lineWidth = 2.6; g.lineCap = 'butt';
    for (const [col, a] of CR_SKIN) {
      g.beginPath();
      for (const m of a) { if (!m.arm) continue; const y = m.yy; g.moveTo(m.x - 5, y + 5); g.lineTo(m.x - 8, y - 6 + m.bob); g.moveTo(m.x + 5, y + 5); g.lineTo(m.x + 8, y - 6 + m.bob); }
      g.strokeStyle = col; g.stroke();
    }
  }
  for (const [col, a] of CR_TUN) {
    g.beginPath();
    for (const m of a) { g.moveTo(m.x - 7.5, m.yy + 10); g.arc(m.x, m.yy + 10, 7.5, Math.PI, 0); g.closePath(); }
    g.fillStyle = col; g.fill();
  }
  for (const [col, a] of CR_SKIN) {
    g.beginPath();
    for (const m of a) { g.moveTo(m.x + 5.6, m.yy); g.arc(m.x, m.yy, 5.6, 0, Math.PI * 2); }
    g.fillStyle = col; g.fill();
  }
  for (const [col, a] of CR_HAIR) {
    g.beginPath();
    for (const m of a) { g.moveTo(m.x + HCX, m.yy - 0.6 + HCY); g.arc(m.x, m.yy - 0.6, 5.8, HA0, HA1); g.closePath(); }
    g.fillStyle = col; g.fill();
  }
}

// ---------- cards -----------------------------------------------------
const CARD_COL = { add: ['#ffe2a8', '#f4a94e', '#e0892f'], up: ['#c9f7b0', '#6fcf5a', '#4fae4c'], rule: ['#eadbff', '#a57ad6', '#9b6ee0'] };
function counterTag(c) {
  if (c.kind !== 'add' || !G.E) return null;
  let best = null, bn = 3;
  for (const t of COUNTERS[c.unit]) { const n = G.E.army[t] || 0; if (n > bn) { bn = n; best = t; } }
  return best ? 'vs ' + UNITS[best].plural : null;
}
function cardImage(c, w, h) {
  if (c._img && c._gen === GEN && c._w === w) return c._img;
  const px = scale * dpr, pad = 4, cvs = document.createElement('canvas');
  cvs.width = Math.ceil((w + pad * 2) * px); cvs.height = Math.ceil((h + pad * 2 + 6) * px);
  const g = cvs.getContext('2d'); g.setTransform(px, 0, 0, px, pad * px, pad * px);
  drawCard(g, c, 0, 0, w, h);
  c._img = cvs; c._gen = GEN; c._w = w; c._pad = pad;
  return cvs;
}
function drawCard(g, c, x, y, w, h) {
  const cc = CARD_COL[c.kind];
  g.save(); g.lineJoin = 'round';
  rr(g, x, y + 5, w, h, 16); fs(g, 'rgba(0,0,0,.35)');
  rr(g, x, y, w, h, 16); fs(g, cc[2], OUT, 3);
  rr(g, x + 5, y + 5, w - 10, h - 10, 12); fs(g, '#fdf1dc');
  const ah = h * 0.6;
  g.save(); rr(g, x + 5, y + 5, w - 10, ah, 12); g.clip();
  const gr = g.createLinearGradient(0, y, 0, y + ah); gr.addColorStop(0, cc[0]); gr.addColorStop(1, cc[1]);
  g.fillStyle = gr; g.fillRect(x, y, w, ah + 6);
  circ(g, x + w / 2, y + ah * 0.55, ah * 0.42); fs(g, 'rgba(255,255,255,.35)');
  const k = w / 60;
  if (c.kind === 'add') drawAddArt(g, c, x + w / 2, y + ah * 0.93, k);
  else if (c.kind === 'up') drawUpArt(g, c, x + w / 2, y + ah * 0.93, k);
  else drawRuleIcon(g, c.id, x + w / 2, y + ah * 0.55, k);
  g.restore();
  // zig-zag divider
  g.beginPath(); g.moveTo(x + 5, y + ah + 5);
  const teeth = 8, tw = (w - 10) / teeth;
  for (let i = 0; i < teeth; i++) { g.lineTo(x + 5 + tw * (i + 0.5), y + ah - 2); g.lineTo(x + 5 + tw * (i + 1), y + ah + 5); }
  g.lineTo(x + w - 5, y + ah + 9); g.lineTo(x + 5, y + ah + 9); g.closePath(); fs(g, cc[2]);
  const title = cardTitle(c), tmax = w - 14, ty = y + ah + (h - ah) * 0.4;
  const size = fitSize(g, title, tmax, 19, 11);
  txt(g, title, x + w / 2, ty, size, '#fff', { lw: 4 });
  const desc = cardDesc(c), ds = w < 110 ? 10 : 11;
  g.font = `400 ${ds}px ${F}`;
  const words = desc.split(' '), lines = [''];
  for (const wd of words) {
    const cur = lines[lines.length - 1], tl = cur ? cur + ' ' + wd : wd;
    if (g.measureText(tl).width > tmax && cur) lines.push(wd); else lines[lines.length - 1] = tl;
  }
  const L = lines.slice(0, 3);
  L.forEach((l, i) => txt(g, l, x + w / 2, y + ah + (h - ah) * 0.74 + (i - (L.length - 1) / 2) * (ds + 2), ds, '#7a5334', { stroke: false }));
  const tag = counterTag(c);
  if (tag) {
    const ts = fitSize(g, tag, w - 26, 12, 8), tw = Math.min(w - 12, g.measureText(tag).width + 16);
    rr(g, x + w / 2 - tw / 2, y + 9, tw, 19, 9.5); fs(g, '#4fae4c', OUT, 2);
    txt(g, tag, x + w / 2, y + 18.5, ts, '#fff', { lw: 3 });
  }
  g.restore();
}
function drawAddArt(g, c, x, y, k) {
  const d = UNITS[c.unit];
  const s = k * (c.unit === 'elephant' ? 0.44 : d.space >= 30 ? 0.62 : 0.78) * d.size;
  const m = Math.min(c.n, d.space >= 30 ? 2 : 5);
  const front = Math.min(m, 3), back = m - front, sp = d.space * s * 0.95;
  const pts = [];
  for (let i = 0; i < back; i++) pts.push([x + (i - (back - 1) / 2) * sp, y - 12 * k * 0.5]);
  for (let i = 0; i < front; i++) pts.push([x + (i - (front - 1) / 2) * sp, y]);
  for (const [px, py] of pts) drawFigure(g, c.unit, 0, 1, px, py, s, { face: 1, noRing: true });
}
function drawUpArt(g, c, x, y, k) {

  drawFigure(g, c.unit, 0, 2, x + 15 * k * 0.6 + (big ? 6 : 0), y, s * 1.15, { face: 1, noRing: true });

function draftLayout(k) {

  const x0 = (W - (k * w + (k - 1) * gap)) / 2, y = 384;
  return Array.from({ length: k }, (_, i) => ({ x: x0 + i * (w + gap), y, w, h }));
}

function render() {
  if (!bgCanvas) buildBg();
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(bgCanvas, 0, 0);
  g.setTransform(scale * dpr, 0, 0, scale * dpr, OX * dpr, OY * dpr);
  G.btns = [];
  g.save();
  if (G.shake > 0.1) g.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
  drawCrowd(g);
  drawKing(g);
  drawWorld(g);
  g.restore();
  drawHUD(g);
  drawUI(g);
}

function drawWorld(g) {
  const st = G.state;
  if (st === 'title' || !G.P) return;
  if (st === 'battle' || st === 'result' || st === 'matchEnd') {
    for (const f of G.fx) {

//  UPDATE & LOOP

function update(dt) {
  G.t += dt;
  if (G.timers.length) {
    const ts = G.timers; G.timers = [];
    const keep = [];
    for (const tm of ts) { tm.t -= dt; if (tm.t <= 0) tm.fn(); else keep.push(tm); }
    G.timers.push(...keep);
  }
  G.shake *= Math.pow(0.02, dt); if (G.shake < 0.1) G.shake = 0;
  const exT = G.state === 'battle' || G.state === 'result' ? 1 : G.state === 'matchEnd' ? 0.8 : 0.25;
  G.excite += (exT - G.excite) * Math.min(1, dt * 2);
  for (const p of G.parts) {
    p.t += dt;
    if (p.type === 'coin' || p.t < 0) continue;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'spark') p.vy += 260 * dt;
    if (p.type === 'puff') { p.vx *= 0.94; p.vy *= 0.94; }
  }
  G.parts = G.parts.filter(p => p.t < p.life);
  for (const f of G.floats) { f.t += dt; f.y -= 28 * dt; }
  G.floats = G.floats.filter(f => f.t < f.life);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.life) G.banner = null; }
  if (G.thumb) { G.thumb.t += dt; if (G.thumb.t > 2.8) G.thumb = null; }
  for (const si of [0, 1]) for (const e of G.pv[si]) {
    if (e.delay > 0) { e.delay -= dt; if (e.delay <= 0) e.pop = 1; continue; }
    e.pop = Math.max(0, e.pop - dt * 2.5);
    const k = Math.min(1, dt * 8);
    e.dx += (e.tx - e.dx) * k; e.dy += (e.ty - e.dy) * k;
  }
  switch (G.state) {
    case 'draft': G.draftAge += dt; G.draftT -= dt; if (G.draftT <= 0) pickCard(0); break;
    case 'reveal': G.revealT += dt; if (G.revealT >= 0.42) finishPick(); break;
    case 'landing': G.landT -= dt; if (G.landT <= 0 && G.timers.length === 0) nextPick(); break;
    case 'formation': G.formT += dt; break;
    case 'battle': if (G.bstart > 0) G.bstart -= dt; else stepBattle(dt); break;
    case 'result': G.rt -= dt; if (G.rt <= 0) afterResult(); break;
  }
}

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; acc += dt;
  while (acc >= STEP) {
    const n = G.state === 'battle' ? G.speed : 1;
    for (let i = 0; i < n; i++) update(STEP);
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}

  return { x: (e.clientX - r.left - OX) / scale, y: (e.clientY - r.top - OY) / scale };
}

  const k = e.key.toLowerCase(), st = G.state;
  if (st === 'draft' && k >= '1' && k <= '4') pickCard(+k - 1);
  else if (st === 'draft' && k === 'r') reroll();
  else if (k === 's' && st === 'battle') cycleSpeed();
  else if (k === 'c' && st === 'battle' && G.mode === 'cmd') useCharge(0);
  else if (k === 'f' && st === 'battle' && G.mode === 'cmd') freeGroup();
  else if (st === 'battle' && G.mode === 'cmd' && k >= '1' && k <= '5' && (+k === 1 || groupAlive(+k - 1))) G.sel = +k - 1;
  else if (k === ' ' || k === 'enter') {
    e.preventDefault();
    if (st === 'title' || st === 'matchEnd') newMatch(G.mode);
    else if (st === 'formation' && G.formT > 0.3 && G.timers.length === 0) startBattle();
    else if (st === 'battle') skipBattle();
    else if (st === 'result') G.rt = 0;
  }
});
cv.addEventListener('contextmenu', e => e.preventDefault());

// exposed for automated testing
window.LEGIO = { G, pickCard, startBattle, newMatch, skipBattle, giveOrder, useCharge };

requestAnimationFrame(frame);
</script>
